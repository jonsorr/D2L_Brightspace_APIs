  independent community project, not affiliated with or endorsed by D2L.
  ---------------------------------------------------------------------------
  HOW IT WORKS
  1. Runs as the signed-in user (browser session + XSRF token, no keys).
  2. Finds the root Content module titled "Announcements".
  3. Collects the HTML file topics in that module (in course order) and
     checks the user's completion for each one.
  4. If any are not completed, opens a pop-up window that shows only those
     pages, one per screen.
       - Next / Dismiss  -> marks the page on screen as completed
       - Previous        -> goes back, changes nothing
       - X / Esc         -> closes, the page on screen stays NOT completed
  5. The widget itself shows nothing on the homepage.

  SETUP: Paste this entire file into a Custom Widget's content (Source Code
  view), add the widget to the course homepage, and in the widget's
  Appearance settings turn off the title and container/border if offered.
  Nothing else to configure.
  ===========================================================================
-->
<div id="d2lww-anchor" aria-hidden="true" style="display:none"></div>
<script>
(function () {
  'use strict';

  /* ---------------------------------------------------------------------
     Settings (fixed - instructors do not change these)
     --------------------------------------------------------------------- */
  var SETTINGS = {
    moduleTitle: 'Announcements',   // Content module to read (case-insensitive)
    orgUnitToken: '{OrgUnitId}',    // Brightspace replace string (fallback: URL)
    firstNameToken: '{FirstName}',  // Brightspace replace string (fallback only)
    hideHostWidget: true            // hide the empty widget box on the homepage
  };

  var DEMO = window.WW_DEMO || null;   // set only by the local preview page
  var api = { le: '1.82', lp: '1.50' };    // replaced by /d2l/api/versions/ at runtime

  /* ---------------------------------------------------------------------
     Host document: if the widget is ever rendered inside an iframe, draw
     the pop-up in the parent page so it covers the whole screen.
     --------------------------------------------------------------------- */
  var W = window;
  try {
    if (window.top !== window.self && window.top.document && window.top.document.body) { W = window.top; }
  } catch (e) { W = window; }
  var D = W.document;

  if (W.__d2lWelcomeWindowLoaded && !DEMO) { return; }
  W.__d2lWelcomeWindowLoaded = true;

  var state = {
    open: false, pages: [], idx: 0, ou: null, userId: null, firstName: '', lastName: '', courseName: '',
    lastFocus: null, ui: null, ro: null, inerted: [], prevOverflow: ''
  };

  /* ---------------------------------------------------------------------
     Styles (colors: #0C436A primary blue, #F5A81C gold, #00293A navy,
     #505859 gray). To re-brand, find and replace these hex values.
     --------------------------------------------------------------------- */
  var CSS = [
    '.d2lww-overlay{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;background:rgba(0,41,58,.62);opacity:0;transition:opacity .18s ease;font-family:"Proxima Nova","proxima-nova",Calibri,"Segoe UI",Arial,sans-serif;}',
    '.d2lww-overlay *,.d2lww-overlay *::before,.d2lww-overlay *::after{box-sizing:border-box;}',
    '.d2lww-overlay.is-open{opacity:1;}',
    '.d2lww-dialog{display:flex;flex-direction:column;width:100%;max-width:1230px;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 14px 44px rgba(0,0,0,.38);transform:translateY(8px) scale(.985);transition:transform .18s ease;}',
    '.d2lww-overlay.is-open .d2lww-dialog{transform:none;}',
    '.d2lww-header{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;padding:10px 10px 10px 24px;background:#0C436A;color:#fff;border-bottom:4px solid #F5A81C;}',
    '.d2lww-greet{margin:0;padding:0;font-family:inherit;font-size:1.3rem;font-weight:600;line-height:1.3;letter-spacing:.04em;color:#fff;outline:none;}',
        '.d2lww-close{flex:none;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;margin:0;padding:0;border:0;border-radius:6px;background:transparent;color:#fff;cursor:pointer;}',
    '.d2lww-close:hover{background:rgba(255,255,255,.16);}',
    '.d2lww-close:focus-visible{outline:3px solid #fff;outline-offset:-3px;}',
    '.d2lww-close svg{width:22px;height:22px;display:block;}',
    '.d2lww-body{flex:1 1 auto;min-height:72px;overflow:auto;background:#fff;padding:8px 16px;}',
    '.d2lww-frame{display:block;width:100%;height:120px;border:0;margin:0;background:#fff;}',
    '.d2lww-footer{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:12px 24px;background:#EEF4F7;border-top:1px solid #B8D1DC;}',
    '.d2lww-left{justify-self:start;}',
    '.d2lww-right{justify-self:end;}',
    '.d2lww-count{margin:0;font-size:.95rem;font-weight:600;letter-spacing:.04em;color:#505859;white-space:nowrap;}',
    '.d2lww-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;min-width:116px;margin:0;padding:10px 22px;border:2px solid #0C436A;border-radius:6px;font-family:inherit;font-size:1rem;font-weight:600;line-height:1.2;letter-spacing:.04em;text-transform:none;cursor:pointer;transition:background-color .12s ease,border-color .12s ease;}',
    '.d2lww-btn[hidden]{display:none;}',
    '.d2lww-btn:focus-visible{outline:3px solid #0C436A;outline-offset:3px;}',
    '.d2lww-btn--secondary{background:#fff;color:#0C436A;}',
    '.d2lww-btn--secondary:hover{background:#DDE9F0;}',
    '.d2lww-btn--primary{background:#0C436A;color:#fff;}',
    '.d2lww-btn--primary:hover{background:#00293A;border-color:#00293A;}',
    '.d2lww-btn--dismiss{background:#F5A81C;border-color:#F5A81C;color:#00293A;}',
    '.d2lww-btn--dismiss:hover{background:#E0950C;border-color:#E0950C;}',
    '.d2lww-btn svg{width:16px;height:16px;flex:none;}',
    '.d2lww-sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}',
    '@media (max-width:540px){.d2lww-overlay{padding:8px;}.d2lww-dialog{max-height:calc(100vh - 16px);max-height:calc(100dvh - 16px);}.d2lww-header{padding-left:16px;}.d2lww-greet{font-size:1.1rem;}.d2lww-body{padding:6px 8px;}.d2lww-footer{padding:10px 12px;gap:8px;}.d2lww-btn{min-width:0;padding:10px 14px;}.d2lww-count{font-size:.85rem;}}',
    '@media (prefers-reduced-motion:reduce){.d2lww-overlay,.d2lww-dialog,.d2lww-btn{transition:none!important;}}',
    '@media (forced-colors:active){.d2lww-dialog{border:2px solid CanvasText;}.d2lww-btn,.d2lww-close{border:2px solid ButtonText;}}'
  ].join('\n');

  function injectStyles() {
    if (D.getElementById('d2lww-styles')) { return; }
    var st = D.createElement('style');
    st.id = 'd2lww-styles';
    st.textContent = CSS;
    (D.head || D.documentElement).appendChild(st);
  }

  /* ---------------------------------------------------------------------
     Helpers
     --------------------------------------------------------------------- */
  function isToken(v) { return !v || /^\{[^}]*\}$/.test(String(v).trim()); }
  function norm(s) { return String(s || '').replace(/\s+/g, ' ').trim().toLowerCase(); }

  function greetingFor(hour) {
    if (hour < 12) { return 'Good Morning'; }      // 12:00 AM - 11:59 AM
    if (hour < 17) { return 'Good Afternoon'; }    // 12:00 PM - 4:59 PM
    return 'Good Evening';                         // 5:00 PM - 11:59 PM
  }

  function resolveOrgUnit() {
    var t = String(SETTINGS.orgUnitToken || '').trim();
    if (!isToken(t) && /^\d+$/.test(t)) { return t; }
    var href = (W.location.pathname || '') + (W.location.search || '');
    var m = href.match(/\/d2l\/home\/(\d+)/) || href.match(/[?&]ou=(\d+)/i);
    return m ? m[1] : null;
  }

  function xsrf() {
    try { return W.localStorage.getItem('XSRF.Token') || ''; } catch (e) { return ''; }
  }

  function getJSON(path) {
    return fetch(path, { credentials: 'same-origin', headers: { 'Accept': 'application/json' } })
      .then(function (r) {
        if (!r.ok) { var err = new Error('HTTP ' + r.status + ' ' + path); err.status = r.status; throw err; }
        return r.json();
      });
  }

  function detectVersions() {
    return getJSON('/d2l/api/versions/').then(function (list) {
      (list || []).forEach(function (p) {
        var code = String(p.ProductCode || '').toLowerCase();
        if ((code === 'le' || code === 'lp') && p.LatestVersion) { api[code] = p.LatestVersion; }
      });
    }).catch(function () { /* keep defaults */ });
  }

  function leBase() { return '/d2l/api/le/' + api.le + '/' + state.ou; }

  // Local backup flag, used only if Brightspace won't report completion.
  function localKey(topicId) { return 'd2lww:' + state.ou + ':' + state.userId + ':' + topicId; }
  function localDone(topicId) { try { return W.localStorage.getItem(localKey(topicId)) === '1'; } catch (e) { return false; } }
  function localMark(topicId) { try { W.localStorage.setItem(localKey(topicId), '1'); } catch (e) { /* ignore */ } }

  function safeUrl(u) {
    u = String(u || '');
    return /%[0-9a-f]{2}/i.test(u) ? u : encodeURI(u);
  }

  /* ---------------------------------------------------------------------
     Brightspace data
     --------------------------------------------------------------------- */
  function isHtmlTopic(o) {
    if (!o || o.Type !== 1 || o.TopicType !== 1 || o.IsHidden || o.IsBroken) { return false; }
    var now = Date.now();
    if (o.StartDate && Date.parse(o.StartDate) > now) { return false; }  // not released yet
    if (o.EndDate && Date.parse(o.EndDate) < now) { return false; }      // availability ended
    var path = String(o.Url || '').split(/[?#]/)[0];
    return /\.html?$/i.test(path);
  }

  async function isTopicComplete(topicId) {
    try {
      var c = await getJSON(leBase() + '/content/topics/' + topicId + '/completions/users/' + state.userId);
      return !!(c && c.CompletionDate);
    } catch (e1) {
      try {
        var p = await getJSON(leBase() + '/content/userprogress/' + topicId);
        return !!(p && (p.Completed || p.CompletedDate));
      } catch (e2) {
        return localDone(topicId);
      }
    }
  }

  async function loadLivePages() {
    state.ou = resolveOrgUnit();
    if (!state.ou) { return []; }
    await detectVersions();

    var res = await Promise.all([
      getJSON('/d2l/api/lp/' + api.lp + '/users/whoami'),
      getJSON(leBase() + '/content/root/')
    ]);
    var me = res[0] || {}, roots = res[1] || [];
    state.userId = String(me.Identifier);
    state.firstName = String(me.FirstName || '').trim() ||
      (isToken(SETTINGS.firstNameToken) ? '' : String(SETTINGS.firstNameToken).trim());

    state.lastName = String(me.LastName || '').trim();
    try {
      var enr = await getJSON('/d2l/api/lp/' + api.lp + '/enrollments/myenrollments/' + state.ou);
      state.courseName = String((enr && enr.OrgUnit && enr.OrgUnit.Name) || '').trim();
    } catch (eName) { state.courseName = ''; }

    var target = norm(SETTINGS.moduleTitle);
    var mod = roots.filter(function (m) { return norm(m.Title) === target && !m.IsHidden; })[0];
    if (!mod) { return []; }

    var items = await getJSON(leBase() + '/content/modules/' + mod.Id + '/structure/');
    var topics = (items || []).filter(isHtmlTopic);
    if (!topics.length) { return []; }

    var done = await Promise.all(topics.map(function (t) { return isTopicComplete(t.Id); }));
    return topics
      .filter(function (t, i) { return !done[i]; })
      .map(function (t) { return { id: t.Id, title: t.Title, url: t.Url }; });
  }

  // Fallback: open the topic in a hidden Content viewer so Brightspace
  // records the visit (completes topics set to automatic tracking).
  function registerVisit(topicId) {
    var f = D.createElement('iframe');
    f.setAttribute('aria-hidden', 'true');
    f.tabIndex = -1;
    f.style.cssText = 'position:absolute;width:1px;height:1px;left:-9999px;top:0;border:0;visibility:hidden;';
    f.src = '/d2l/le/content/' + state.ou + '/viewContent/' + topicId + '/View';
    var cleanup = function () { setTimeout(function () { if (f.parentNode) { f.parentNode.removeChild(f); } }, 2500); };
    f.addEventListener('load', cleanup);
    setTimeout(cleanup, 15000);
    D.body.appendChild(f);
  }

  function markComplete(page) {
    if (!page || page.markedThisSession) { return; }
    page.markedThisSession = true;

    if (DEMO) {
      page.done = true;
      if (typeof DEMO.onComplete === 'function') { DEMO.onComplete(page); }
      return;
    }

    localMark(page.id);
    fetch(leBase() + '/content/topics/' + page.id + '/completions/users/' + state.userId, {
      method: 'PUT',
      credentials: 'same-origin',
      keepalive: true,
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json', 'X-Csrf-Token': xsrf() },
      body: JSON.stringify({ CompletedDate: new Date().toISOString() })
    }).then(function (r) {
      if (!r.ok) { throw new Error('HTTP ' + r.status); }
    }).catch(function (err) {
      if (W.console) { W.console.warn('[Welcome Window] completion PUT failed, using visit fallback:', err); }
      registerVisit(page.id);
    });
  }

  /* ---------------------------------------------------------------------
     UI
     --------------------------------------------------------------------- */
  var ICON_X = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>';
  var ICON_PREV = '<svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var ICON_NEXT = '<svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function buildUI() {
    var overlay = D.createElement('div');
    overlay.className = 'd2lww-overlay';
    overlay.innerHTML =
      '<div class="d2lww-dialog" role="dialog" aria-modal="true" aria-labelledby="d2lww-greet">' +
        '<div class="d2lww-header">' +
          '<h2 class="d2lww-greet" id="d2lww-greet" tabindex="-1"></h2>' +
          '<button type="button" class="d2lww-close" aria-label="Close announcements">' + ICON_X + '</button>' +
        '</div>' +
        '<div class="d2lww-body">' +
          '<iframe class="d2lww-frame" title="Announcement"></iframe>' +
        '</div>' +
        '<div class="d2lww-footer">' +
          '<div class="d2lww-left"><button type="button" class="d2lww-btn d2lww-btn--secondary" data-ww="prev">' + ICON_PREV + '<span>Previous</span></button></div>' +
          '<p class="d2lww-count" aria-hidden="true"></p>' +
          '<div class="d2lww-right"><button type="button" class="d2lww-btn d2lww-btn--primary" data-ww="next"><span>Next</span>' + ICON_NEXT + '</button></div>' +
        '</div>' +
        '<div class="d2lww-sr" aria-live="polite" aria-atomic="true"></div>' +
      '</div>';

    var ui = {
      overlay: overlay,
      dialog: overlay.querySelector('.d2lww-dialog'),
      greet: overlay.querySelector('.d2lww-greet'),
      close: overlay.querySelector('.d2lww-close'),
      body: overlay.querySelector('.d2lww-body'),
      frame: overlay.querySelector('.d2lww-frame'),
      prev: overlay.querySelector('[data-ww="prev"]'),
      next: overlay.querySelector('[data-ww="next"]'),
      count: overlay.querySelector('.d2lww-count'),
      live: overlay.querySelector('.d2lww-sr')
    };

    ui.close.addEventListener('click', closeWindow);
    ui.prev.addEventListener('click', onPrev);
    ui.next.addEventListener('click', onNext);
    ui.dialog.addEventListener('keydown', onDialogKey);
    ui.frame.addEventListener('load', onFrameLoad);
    return ui;
  }

  function focusables() {
    var ui = state.ui;
    return [ui.close, ui.prev, ui.next].filter(function (b) { return b && !b.hidden; });
  }

  function onDialogKey(e) {
    if (e.key === 'Escape' || e.key === 'Esc') { e.preventDefault(); closeWindow(); return; }
    if (e.key !== 'Tab') { return; }
    var list = focusables();
    if (!list.length) { return; }
    var first = list[0], last = list[list.length - 1], active = D.activeElement;
    if (e.shiftKey && (active === first || active === state.ui.greet)) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && active === last) { e.preventDefault(); first.focus(); }
  }

  // Measure the page's real content height without collapsing the frame first.
  // (Collapsing it to 0px reset the window's scroll position to the top every
  // time an accordion or other expanding element changed size.)
  function contentHeight(d) {
    var html = d.documentElement, body = d.body;
    var h = Math.ceil(html.getBoundingClientRect().height);
    if (body) {
      var cs = d.defaultView ? d.defaultView.getComputedStyle(body) : null;
      var margins = cs ? (parseFloat(cs.marginTop) || 0) + (parseFloat(cs.marginBottom) || 0) : 0;
      h = Math.max(h, Math.ceil(body.scrollHeight + margins));
    }
    return h;
  }

  function fit() {
    var ui = state.ui; if (!ui) { return; }
    var f = ui.frame, d;
    try { d = f.contentDocument; } catch (e) { return; }
    if (!d || !d.documentElement) { return; }
    var keepTop = ui.body.scrollTop;
    var h = contentHeight(d) + 1;
    if (Math.abs((parseFloat(f.style.height) || 0) - h) > 1) { f.style.height = h + 'px'; }
    if (ui.body.scrollTop !== keepTop) { ui.body.scrollTop = keepTop; }
  }

  var fitQueued = false;
  function queueFit() {
    if (fitQueued) { return; }
    fitQueued = true;
    W.requestAnimationFrame(function () { fitQueued = false; fit(); });
  }

  function onFrameLoad() {
    var ui = state.ui; if (!ui) { return; }
    var f = ui.frame, d = null;
    if (state.ro) { state.ro.disconnect(); state.ro = null; }
    try { d = f.contentDocument; } catch (e) { d = null; }

    if (d && d.documentElement) {
      // Fit the page into the window width so there is no sideways scrolling.
      var st = d.createElement('style');
      st.setAttribute('data-ww', '');
      st.textContent = 'html,body{overflow:hidden!important;height:auto!important;min-height:0!important;}img,video,svg,canvas,iframe,embed,object,table,pre{max-width:100%;}img,video{height:auto;}pre{white-space:pre-wrap;}';
      (d.head || d.documentElement).appendChild(st);

      fillTokens(d);

      if (!d.documentElement.getAttribute('lang')) { d.documentElement.setAttribute('lang', D.documentElement.getAttribute('lang') || 'en'); }

      d.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' || e.key === 'Esc') { e.preventDefault(); closeWindow(); }
      });
      // Links inside an announcement open in a new tab so the window stays put.
      d.addEventListener('click', function (e) {
        var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
        if (!a) { return; }
        var href = a.getAttribute('href') || '';
        if (href.charAt(0) === '#' || /^javascript:/i.test(href)) { return; }
        if (!a.target || a.target === '_self' || a.target === '_parent' || a.target === '_top') { a.target = '_blank'; }
        if (a.target === '_blank') { a.rel = 'noopener'; }
      });

      fit();
      var RO = f.contentWindow && f.contentWindow.ResizeObserver || W.ResizeObserver;
      if (RO && d.body) { state.ro = new RO(queueFit); state.ro.observe(d.body); }
      Array.prototype.forEach.call(d.images || [], function (img) {
        if (!img.complete) { img.addEventListener('load', queueFit); img.addEventListener('error', queueFit); }
      });
      if (d.fonts && d.fonts.ready) { d.fonts.ready.then(queueFit); }
    } else {
      f.style.height = '60vh';  // cannot measure (should not happen same-origin)
    }
    ui.body.removeAttribute('aria-busy');
  }

  // Fill Brightspace replace strings ({OrgUnitName}, {FirstName}, {LastName})
  // in case the page file is served without the Content viewer processing them.
  function fillTokens(d) {
    var map = { '{OrgUnitName}': state.courseName, '{FirstName}': state.firstName, '{LastName}': state.lastName };
    var re = /\{(OrgUnitName|FirstName|LastName)\}/g;
    var swap = function (txt) { return txt.replace(re, function (m) { return map[m] || m; }); };
    if (!d.body) { return; }
    var walker = d.createTreeWalker(d.body, 4 /* NodeFilter.SHOW_TEXT */, null);
    var node;
    while ((node = walker.nextNode())) {
      if (re.test(node.nodeValue)) { re.lastIndex = 0; node.nodeValue = swap(node.nodeValue); }
      re.lastIndex = 0;
    }
    Array.prototype.forEach.call(d.querySelectorAll('[alt],[title],[aria-label]'), function (el) {
      ['alt', 'title', 'aria-label'].forEach(function (a) {
        var v = el.getAttribute(a);
        if (v && v.indexOf('{') > -1) { el.setAttribute(a, swap(v)); }
      });
    });
    if (d.title && d.title.indexOf('{') > -1) { d.title = swap(d.title); }
  }

  function show(i) {
    var ui = state.ui, p = state.pages[i], total = state.pages.length;
    if (!ui || !p) { return; }
    state.idx = i;
    var isLast = i === total - 1;
    var label = 'Page ' + (i + 1) + ' of ' + total;

    ui.body.setAttribute('aria-busy', 'true');
    ui.body.scrollTop = 0;
    ui.frame.title = p.title || 'Announcement';
    if (p.html != null) { ui.frame.removeAttribute('src'); ui.frame.srcdoc = p.html; }
    else { ui.frame.removeAttribute('srcdoc'); ui.frame.src = safeUrl(p.url); }

    var prevHad = D.activeElement === ui.prev;
    ui.prev.hidden = i === 0;
    ui.count.textContent = label;
    ui.next.className = 'd2lww-btn ' + (isLast ? 'd2lww-btn--dismiss' : 'd2lww-btn--primary');
    ui.next.innerHTML = isLast ? '<span>Dismiss</span>' : '<span>Next</span>' + ICON_NEXT;
    ui.live.textContent = label + ': ' + (p.title || 'Announcement');
    if (prevHad && ui.prev.hidden) { ui.next.focus(); }
  }

  function onNext() {
    markComplete(state.pages[state.idx]);
    if (state.idx >= state.pages.length - 1) { closeWindow(); }
    else { show(state.idx + 1); }
  }

  function onPrev() {
    if (state.idx > 0) { show(state.idx - 1); }
  }

  function setInert(on) {
    if (on) {
      state.inerted = [];
      Array.prototype.forEach.call(D.body.children, function (el) {
        if (el === state.ui.overlay || el.tagName === 'SCRIPT' || el.tagName === 'STYLE') { return; }
        if (!el.inert) { el.inert = true; state.inerted.push(el); }
      });
    } else {
      state.inerted.forEach(function (el) { el.inert = false; });
      state.inerted = [];
    }
  }

  function openWindow(pages, firstName) {
    if (state.open || !pages || !pages.length) { return; }
    injectStyles();
    state.pages = pages;
    state.idx = 0;
    state.lastFocus = D.activeElement;
    var ui = state.ui = buildUI();

    var hour = (DEMO && typeof DEMO.hour === 'number') ? DEMO.hour : new Date().getHours();
    var greet = greetingFor(hour);
    ui.greet.textContent = firstName ? greet + ', ' + firstName : greet;

    D.body.appendChild(ui.overlay);
    state.prevOverflow = D.documentElement.style.overflow;
    D.documentElement.style.overflow = 'hidden';
    setInert(true);
    state.open = true;
    W.addEventListener('resize', queueFit);

    show(0);
    W.requestAnimationFrame(function () {
      ui.overlay.classList.add('is-open');
      ui.greet.focus();
    });
  }

  function closeWindow() {
    if (!state.open) { return; }
    var ui = state.ui;
    if (state.ro) { state.ro.disconnect(); state.ro = null; }
    W.removeEventListener('resize', queueFit);
    setInert(false);
    D.documentElement.style.overflow = state.prevOverflow || '';
    if (ui && ui.overlay.parentNode) { ui.overlay.parentNode.removeChild(ui.overlay); }
    state.open = false;
    state.ui = null;
    var back = state.lastFocus;
    if (back && back.focus && D.contains(back)) { try { back.focus(); } catch (e) { /* ignore */ } }
    if (DEMO && typeof DEMO.onClose === 'function') { DEMO.onClose(); }
  }

  /* ---------------------------------------------------------------------
     Hide the empty widget tile and start
     --------------------------------------------------------------------- */
  function hideHost() {
    if (DEMO || !SETTINGS.hideHostWidget) { return; }
    var start = window.frameElement || document.getElementById('d2lww-anchor');
    var host = start && start.closest ? start.closest('.d2l-widget, d2l-widget, .d2l-homepage-widget') : null;
    if (host) { host.style.display = 'none'; }
  }

  async function start() {
    if (state.open) { return; }
    try {
      var pages, name;
      if (DEMO) {
        pages = (DEMO.pages || []).filter(function (p) { p.markedThisSession = false; return !p.done; });
        name = DEMO.firstName || '';
        state.firstName = name;
        state.courseName = DEMO.courseName || '';
      } else {
        pages = await loadLivePages();
        name = state.firstName;
      }
      if (pages.length) { openWindow(pages, name); }
    } catch (err) {
      if (W.console) { W.console.warn('[Welcome Window]', err); }
    }
  }

  W.D2LWelcomeWindow = { start: start, close: closeWindow };
  hideHost();
  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', start); }
  else { start(); }
})();
</script>
