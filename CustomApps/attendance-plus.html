    var t = d.createElement('div'); t.className = 'atg-toast'; t.setAttribute('aria-hidden', 'true'); t.textContent = text;
    d.body.appendChild(t); announce(d, text); setTimeout(function () { t.remove(); }, 4500);
  }

  /* ------------------------------------------------------------------ *
   *  At-risk flags (register's Cause for Concern %)
   * ------------------------------------------------------------------ */
  function loadAtRisk(state) {
    var m = state.model;
    var pctHead = m.table.querySelector('[data-fieldname="PercentAttendance"]');
    if (!pctHead) return;                                   // totals collapsed / no % column
    fetch(SETTINGS.attendanceRoot + 'registers/registers_list.d2l?ou=' + encodeURIComponent(OU), { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.text() : ''; })
      .catch(function () { return ''; })
      .then(function (html) {
        var pct = NaN;
        if (html) {
          var doc = new DOMParser().parseFromString(html, 'text/html');
          var head = null, col = -1;
          Array.prototype.forEach.call(doc.querySelectorAll('tr'), function (tr) {
            if (head) return;
            Array.prototype.forEach.call(tr.cells, function (c, i) { if (/cause for concern/i.test(txt(c))) { head = tr; col = i; } });
          });
          if (head) {
            Array.prototype.forEach.call(doc.querySelectorAll('a[href*="data_list.d2l"]'), function (a) {
              if (qpi(a.getAttribute('href'), 'registerId') !== String(state.registerId)) return;
              var tr = a.closest('tr'); if (tr && tr.cells[col]) pct = parseFloat(txt(tr.cells[col]).replace('%', ''));
            });
          }
        }
        if (isNaN(pct) && typeof SETTINGS.atRiskDefaultPercent === 'number') pct = SETTINGS.atRiskDefaultPercent;
        if (!isNaN(pct) && state.d.defaultView) applyAtRisk(state, pct);
      });
  }

  function applyAtRisk(state, pct) {
    var d = state.d, m = state.model, risky = [];
    m.learners.forEach(function (L) {
      var cell = L.totalCells[L.totalCells.length - 1];

        L.th.appendChild(b);
      }
    });
    state.risky = risky;
    var box = state.opts && state.opts.querySelector('.atg-risk'); if (!box) return;

  /* ------------------------------------------------------------------ *
   *  Unsaved-mark recovery
   * ------------------------------------------------------------------ */
  function draftKey(state) { return 'atg.draft.' + OU + '.' + state.registerId; }
  function saveDraft(state) {
    if (!F.draftRecovery) return;
    var items = Object.keys(state.changes).map(function (k) { var x = state.changes[k]; return { uid: x.uid, sid: x.sid, val: x.val }; });
    if (!items.length) { clearDraft(state); return; }
    lsSet(draftKey(state), JSON.stringify({ t: Date.now(), v: VERSION, items: items }));
  }
  function clearDraft(state) { try { window.localStorage.removeItem(draftKey(state)); } catch (e) {} }
  function offerDraft(state, then) {
    var done = function () { state.draftPending = false; if (then) then(); };
    if (!F.draftRecovery || changeCount(state)) return done();
    var dr = null; try { dr = JSON.parse(lsGet(draftKey(state)) || 'null'); } catch (e) {}
    if (!dr || !dr.items || !dr.items.length) return done();
    if (Date.now() - dr.t > (SETTINGS.draftKeepDays || 7) * 864e5) { clearDraft(state); return done(); }
    state.draftPending = true;
    var when = new Date(dr.t);
    var ui = modal(state, '<h2 id="atg-draft-title">Unsaved marks found</h2>' +
      '<p id="atg-draft-desc">' + dr.items.length + ' mark' + (dr.items.length === 1 ? '' : 's') + ' from ' + escapeHtml(when.toLocaleString()) +
      ' were never saved. Put them back so you can review and Save them?</p>' +
      '<div class="atg-btnrow"><button type="button" class="d2l-button atg-discard">Discard</button><button type="button" class="d2l-button atg-restore" primary>Restore marks</button></div>', 'atg-draft-title');
    ui.setAttribute('aria-describedby', 'atg-draft-desc');
    ui.querySelector('.atg-restore').addEventListener('click', function () {
      closeModal(state);
      var m = state.model, batch = [], missing = 0;
      dr.items.forEach(function (x) {
        var c = -1; m.sessions.forEach(function (s, i) { if (s.id === x.sid) c = i; });
        var r = -1; m.learners.forEach(function (L, i) { if (L.uid === x.uid) r = i; });
        var sel = r > -1 && c > -1 ? m.learners[r].sessionCells[c].querySelector('.atg-sel') : null;
        if (!sel || !Array.prototype.some.call(sel.options, function (o) { return o.value === x.val; })) { missing++; return; }
        batch.push({ r: r, c: c, prev: setCell(state, r, c, x.val, false) });
      });
      if (batch.length) state.undo.push(batch);
      state.draftPending = false;
      updateBar(state);
      toast(state, batch.length + ' mark' + (batch.length === 1 ? '' : 's') + ' restored' + (missing ? ' (' + missing + ' no longer match this page)' : '') + '. Click Save to keep them.');
      if (then) then();
    });
    ui.querySelector('.atg-discard').addEventListener('click', function () {
      closeModal(state); clearDraft(state); toast(state, 'Unsaved marks discarded.'); done();
    });
    ui.querySelector('.atg-restore').focus();
  }

  /* ------------------------------------------------------------------ *
   *  Take Attendance — pick ANY session (date names, "Week 1 Class 2", "Lab 3"…)
   *  Suggests one, but never assumes today's date is the session being entered.
   * ------------------------------------------------------------------ */
  function sessionMarks(state, c) {
    var m = state.model, marked = 0, total = 0;
    m.learners.forEach(function (L) {
      var cell = L.sessionCells[c]; if (!cell) return;
      total++;
      var sel = cell.querySelector('.atg-sel');
      var v = sel ? sel.value : txt(cell.querySelector('label') || cell);
      if (v && v !== '0' && v !== '-' && v !== '–') marked++;
    });
    return { marked: marked, total: total };
  }
  function parseSessionDate(name) {
    var t = Date.parse(String(name).replace(/(\d+)(st|nd|rd|th)\b/gi, '$1'));
    if (isNaN(t)) { var mm = String(name).match(/(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/); if (mm) { var y = mm[3] ? (+mm[3] < 100 ? 2000 + +mm[3] : +mm[3]) : new Date().getFullYear(); t = new Date(y, +mm[1] - 1, +mm[2]).getTime(); } }
    if (isNaN(t)) return null;
    var dt = new Date(t); dt.setHours(0, 0, 0, 0); return dt;
  }
  function suggestSession(state) {
    var m = state.model, today = new Date(); today.setHours(0, 0, 0, 0);
    var info = m.sessions.map(function (s, c) { var k = sessionMarks(state, c); return { c: c, date: parseSessionDate(s.name), marked: k.marked, total: k.total }; });
    var last = lsGet('atg.lastTake.' + OU + '.' + state.registerId);
    var dated = info.filter(function (x) { return x.date; }).length >= Math.ceil(info.length / 2);
    var open = function (x) { return x.marked < x.total; };
    if (dated) {
      var past = info.filter(function (x) { return x.date && x.date <= today; });
      var lastOpen = past.filter(open).pop();
      if (lastOpen) return { c: lastOpen.c, why: 'the most recent session on or before today that isn\'t fully marked' };
    }
    var firstEmpty = info.filter(function (x) { return x.marked === 0; })[0];
    if (firstEmpty) return { c: firstEmpty.c, why: 'the first session with no marks yet' };
    var firstOpen = info.filter(open)[0];
    if (firstOpen) return { c: firstOpen.c, why: 'the first session that isn\'t fully marked' };
    var li = -1; m.sessions.forEach(function (s, i) { if (s.id === last) li = i; });
    return { c: li > -1 ? li : info.length - 1, why: li > -1 ? 'the session you used last time' : 'the last session' };
  }

  function openTakeDialog(state, opener) {
    var d = state.d, m = state.model;

    var today = new Date(); today.setHours(0, 0, 0, 0);
    var startSym = SETTINGS.takeAttendanceStartWith || '';
    var startId = (m.statuses.filter(function (s) { return s.sym.toLowerCase() === startSym.toLowerCase(); })[0] || {}).id || '';
    var rows = m.sessions.map(function (s, c) {
      var k = sessionMarks(state, c), dt = parseSessionDate(s.name);
      var tag = k.marked === 0 ? 'No marks yet' : k.marked >= k.total ? 'All ' + k.total + ' marked' : k.marked + ' of ' + k.total + ' marked';
      if (dt && dt.getTime() === today.getTime()) tag += ' · Today';
      return '<label class="atg-take-row"><input type="radio" name="atg-take-s" value="' + c + '"' + (c === sug.c ? ' checked' : '') + '> ' +
        '<span class="atg-take-name">' + escapeHtml(s.name) + '</span><span class="atg-take-tag">' + escapeHtml(tag) + '</span></label>';
    }).join('');
    state.returnFocus = opener;
    var ui = modal(state,
      '<h2 id="atg-take-title">' + escapeHtml(LBL.takeAttendance) + '</h2>' +

      (m.sessions.length > 8 ? '<input type="search" class="atg-gd-filter atg-take-filter" placeholder="Find a session…" aria-label="Find a session">' : '') +
      '<div class="atg-take-list">' + rows + '</div></fieldset>' +
      '<fieldset class="atg-take-fs"><legend>Start learners who have no mark as</legend><div class="atg-take-start">' +
        '<label><input type="radio" name="atg-take-f" value=""' + (startId ? '' : ' checked') + '> Leave blank (mark each learner)</label>' +
        m.statuses.map(function (s) { return '<label><input type="radio" name="atg-take-f" value="' + s.id + '"' + (s.id === startId ? ' checked' : '') + '> ' + escapeHtml(s.sym) + '</label>'; }).join('') +
      '</div><p class="atg-tip">Marks already entered are never changed. Then fix the exceptions and Save.</p></fieldset>' +
      '<div class="atg-btnrow"><button type="button" class="d2l-button atg-take-cancel">Cancel</button>' +
      (F.attendanceByGrades ? '<button type="button" class="d2l-button atg-take-grades">Use grades instead</button>' : '') +
      '<button type="button" class="d2l-button atg-take-go" primary>Start</button></div>', 'atg-take-title');
    ui.classList.add('atg-take');
    var chosen = function () { var r = ui.querySelector('input[name="atg-take-s"]:checked'); return r ? +r.value : sug.c; };
    var fill = function () { var r = ui.querySelector('input[name="atg-take-f"]:checked'); return r ? r.value : ''; };
    var onEsc = function (e) { if (e.key === 'Escape') { e.preventDefault(); finish(); } };
    var finish = function () { d.removeEventListener('keydown', onEsc, true); closeModal(state); };
    d.addEventListener('keydown', onEsc, true);
    var flt = ui.querySelector('.atg-take-filter');
    if (flt) flt.addEventListener('input', function () {

    });
    var go = function (grades) {
      var c = chosen(), pending = { sid: m.sessions[c].id, fill: grades ? '' : fill(), grades: !!grades };
      lsSet('atg.lastTake.' + OU + '.' + state.registerId, pending.sid);

    ui.querySelector('.atg-take-go').addEventListener('click', function () { go(false); });
    var gb = ui.querySelector('.atg-take-grades'); if (gb) gb.addEventListener('click', function () { go(true); });
    var sel = ui.querySelector('input[name="atg-take-s"]:checked');
    if (sel) { sel.focus(); var row = sel.closest('.atg-take-row'); if (row && row.scrollIntoView) row.scrollIntoView({ block: 'nearest' }); }
  }

  function runPendingTake(state) {
    var raw = ssGet('atg.take.' + state.registerId);

  function runTake(state, p) {
    var m = state.model, d = state.d, c = -1;
    m.sessions.forEach(function (s, i) { if (s.id === p.sid) c = i; });
    if (c < 0) { toast(state, 'That session isn\'t on this page.', true); return; }
    Array.prototype.forEach.call(m.table.querySelectorAll('.atg-take-col'), function (x) { x.classList.remove('atg-take-col'); });
    Array.prototype.forEach.call(m.table.querySelectorAll('.atg-take-sr'), function (x) { x.remove(); });
    var s = m.sessions[c];

    var sr = d.createElement('span'); sr.className = 'atg-sr atg-take-sr'; sr.textContent = ' (taking attendance)'; s.th.appendChild(sr);
    m.learners.forEach(function (L) { if (L.sessionCells[c]) L.sessionCells[c].classList.add('atg-take-col'); });
    // bring the column into view next to the frozen Learner column

    if (first) setTimeout(function () { first.focus(); }, 60);
  }

  function diagnostics(state, failed, okCount) {

      lines.push('- ' + (L ? L.name : '?') + ' (user ' + f.item.uid + ') | ' + (s ? s.name : '?') + ' (session ' + f.item.sid + ') | wanted ' + sym + ' | ' + f.why);

  /* ------------------------------------------------------------------ *
   *  New / Edit Register — Create Sessions from Date Range, date pickers, date-name check
   * ------------------------------------------------------------------
   * Based on code from "D2L Attendance Register Generator" by Henry Ecker.
   * Updated and revamped code to work inside any D2L instance without extra pages and plugins by Jonathan Sorrenti.
   * ------------------------------------------------------------------ */
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  var WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var SN = SETTINGS.sessionNames || { format: 'MMMM D, YYYY', autoFormat: true, check: 'warn' };

  function fmtDate(dt, fmt) {
    var pad = function (n) { return (n < 10 ? '0' : '') + n; };
    return String(fmt || SN.format).replace(/dddd|ddd|MMMM|MMM|MM|M|DD|D|YYYY|YY/g, function (t) {
      switch (t) {
        case 'dddd': return WEEKDAYS[dt.getDay()];
        case 'ddd': return WEEKDAYS[dt.getDay()].slice(0, 3);
        case 'MMMM': return MONTHS[dt.getMonth()];
        case 'MMM': return MONTHS[dt.getMonth()].slice(0, 3);
        case 'MM': return pad(dt.getMonth() + 1);
        case 'M': return String(dt.getMonth() + 1);
        case 'DD': return pad(dt.getDate());
        case 'D': return String(dt.getDate());
        case 'YYYY': return String(dt.getFullYear());
        case 'YY': return String(dt.getFullYear()).slice(2);
      }
      return t;
    });
  }

    var onEsc = function (e) { if (e.key === 'Escape') { e.preventDefault(); done(); } };
    var done = function () { d.removeEventListener('keydown', onEsc, true); closeModal(rs); };
    d.addEventListener('keydown', onEsc, true);
    $('.atg-gen-cancel').addEventListener('click', done);
    $('.atg-gen-go').addEventListener('click', function () {
      var f = readForm(), p = problems(f);
      $('#atg-gen-errs').textContent = p.join(' ');
      if (p.length) { (f.start ? (f.end && f.end >= f.start ? ui.querySelector('input[name="atg-gen-day"]') : $('#atg-gen-end')) : $('#atg-gen-start')).focus(); return; }
      var names = current.filter(function (x) { return !x.dup && !excluded[x.iso]; }).map(function (x) { return fmtDate(x.dt); });
      if (!names.length) { $('#atg-gen-errs').textContent = 'There are no sessions to create. Check the dates, days and skipped dates.'; return; }
      lsSet('atg.gen.dates.' + OU, JSON.stringify({ start: f.startV, end: f.endV }));
      lsSet('atg.gen.last', JSON.stringify({ days: f.days, skips: f.skips.filter(function (k) {
        return !(SETTINGS.skipDates || []).some(function (s) { return s.from === k.from && (s.to || '') === (k.to || ''); });
      }) }));
      done();
      runRegisterJob(rs, { names: names, mode: f.mode, rounds: 0 });
    });
    refresh();
    setTimeout(function () { $('#atg-gen-start').focus(); }, 30);

    // Start with the course offering's Start/End Date (unless this user already picked dates for this course)
    if (F.prefillCourseDates && !(mine.start || mine.end)) {
      var touched = { start: false, end: false };
      $('#atg-gen-start').addEventListener('input', function () { touched.start = true; });
      $('#atg-gen-end').addEventListener('input', function () { touched.end = true; });
      courseDates().then(function (cd) {
        if (!ui.isConnected) return;
        var src = $('#atg-gen-src'), filled = [];
        if (cd.start && !touched.start && !$('#atg-gen-start').value) { $('#atg-gen-start').value = cd.start; filled.push('start'); }
        if (cd.end && !touched.end && !$('#atg-gen-end').value) { $('#atg-gen-end').value = cd.end; filled.push('end'); }
        if (filled.length) {
          src.textContent = 'Filled in from the course\'s ' + (filled.length === 2 ? 'start and end dates' : filled[0] + ' date') + '. Change them if your class meets on different dates.';
          announce(d, 'First and last day of class filled in from the course dates.');
          refresh();
        } else {
          src.textContent = cd.start || cd.end ? '' : 'This course has no start or end date set, so pick the dates.';
        }
      });
    }
  }

  // ---- filling D2L's table (survives D2L's page reload when it adds rows) ----
  function jobKey(rs) { return 'atg.genjob.' + OU + '.' + (qpi(rs.w.location.href, 'registerId') || 'new'); }
  function resumeRegisterJob(rs) {
    var raw = ssGet(jobKey(rs)); if (!raw) return;
    ssSet(jobKey(rs), null);
    var job = null; try { job = JSON.parse(raw); } catch (e) {}
    if (!job) return;
    setTimeout(function () {
      if (job.snap) { try { restoreForm(rs, job.snap); } catch (e) {} }
      runRegisterJob(rs, job);
    }, 300);
  }

  function runRegisterJob(rs, job) {
    var d = rs.d, w = rs.w;
    var rows = regRows(d);
    var names = job.names.slice();
    if (job.mode === 'append') {
      // never touch named rows; fill empty rows (restoring deleted empty ones), then add more
      var empty = rows.filter(function (r) { return !getVal(r.name).trim(); });
      var need = names.length - empty.length;
      if (need > 0) return addMoreRows(rs, job, need, rows.length);
      empty.forEach(function (r) {
        if (names.length) { setRowDeleted(rs, r, false); setVal(w, r.name, names.shift()); }
        else setRowDeleted(rs, r, true);                                // leftover blank rows are removed
      });
      return finishJob(rs, job.names.length, rows);
    }
    // replace: the first N rows get the dates, the rest are removed
    if (rows.length < names.length) return addMoreRows(rs, job, names.length - rows.length, rows.length);
    rows.forEach(function (r, i) {
      if (i < names.length) { setRowDeleted(rs, r, false); setVal(w, r.name, names[i]); }
      else setRowDeleted(rs, r, true);
    });
    finishJob(rs, names.length, rows);
  }

  function clickCtl(r, re) { var c = rowControl(r.row, re); if (c) c.click(); }
  // D2L's Delete link is a toggle (DeleteSession(key)); its label stays "Delete Entry N" and the
  // name box is disabled while deleted. Use D2L's own function, else the link.
  function rowKey(r) { return (r.name.getAttribute('name') || '').replace(/^name_/, ''); }
  function setRowDeleted(rs, r, wantDeleted) {
    if (rowDeleted(r) === wantDeleted) return;
    var key = rowKey(r);
    if (key && typeof rs.w.DeleteSession === 'function') { try { rs.w.DeleteSession(key); } catch (e) {} }
    if (rowDeleted(r) !== wantDeleted) clickCtl(r, /delete|restore|remove/i);
  }

  // D2L adds rows by reloading the page with a bigger row count, and the reload keeps nothing typed.
  // So: copy the form, ask D2L for the rows exactly as its own Add Sessions does, then put it all back.
  function snapshotForm(d) {
    var snap = { fields: [], numbers: [] };
    Array.prototype.forEach.call(d.querySelectorAll('input[name], textarea[name], select[name]'), function (el) {
      var n = el.getAttribute('name');
      if (!n || /^d2l_/.test(n) || n === 'sessionOrder_n' || el.type === 'hidden' || el.type === 'button' || el.type === 'submit' || el.closest('.atg-modal') || el.classList.contains('atg-rowdate')) return;
      snap.fields.push({ n: n, type: el.type || el.tagName.toLowerCase(), value: el.value, checked: !!el.checked });
    });
    Array.prototype.forEach.call(d.querySelectorAll('d2l-input-number'), function (el) {
      var label = el.getAttribute('label') || '';
      if (/sessions to add/i.test(label) || el.value == null || el.value === '') return;
      snap.numbers.push({ label: label, value: el.value });
    });
    return snap;
  }
  function restoreForm(rs, snap) {
    var d = rs.d, w = rs.w;
    (snap.fields || []).forEach(function (f) {
      var els = Array.prototype.filter.call(d.getElementsByName(f.n), function (el) { return !el.closest('.atg-modal'); });
      if (f.type === 'radio') { els.forEach(function (el) { if (el.value === f.value && f.checked && !el.checked) { el.checked = true; el.dispatchEvent(new w.Event('click', { bubbles: true })); el.dispatchEvent(new w.Event('change', { bubbles: true })); } }); return; }
      var el = els[0]; if (!el) return;
      if (f.type === 'checkbox') { if (el.checked !== f.checked) { el.checked = f.checked; el.dispatchEvent(new w.Event('change', { bubbles: true })); } return; }
      if (el.tagName === 'SELECT') {
        var ctl = null; try { ctl = w.UI && w.UI.GetByName && w.UI.GetByName(f.n); } catch (e) {}
        try { if (ctl && typeof ctl.SelectOptionByKey === 'function') ctl.SelectOptionByKey(f.value, true); } catch (e) {}
        if (el.value !== f.value) { el.value = f.value; el.dispatchEvent(new w.Event('change', { bubbles: true })); }
        return;
      }
      if (getVal(el) !== f.value && f.value !== '') setVal(w, el, f.value);
    });
    (snap.numbers || []).forEach(function (nu) {
      var el = Array.prototype.filter.call(d.querySelectorAll('d2l-input-number'), function (x) { return (x.getAttribute('label') || '') === nu.label; })[0];
      if (el) { el.value = nu.value; ['input', 'change'].forEach(function (t) { try { el.dispatchEvent(new w.Event(t, { bubbles: true, composed: true })); } catch (e) {} }); }
    });
  }
  function groupsChosen(d) {
    var rb = d.querySelectorAll('input[type="radio"][name="RB_userOption"]');
    return rb.length > 1 && rb[rb.length - 1].checked;
  }

  function addMoreRows(rs, job, need, haveRows) {
    var w = rs.w, d = rs.d;
    if (!job.groupsOk && job.rounds === 0 && groupsChosen(d)) {
      var ui = modal(rs, '<h2 id="atg-grp-title">Groups and sections need to be picked again</h2>' +
        '<p id="atg-grp-desc">Adding ' + need + ' more session row' + (need === 1 ? '' : 's') + ' reloads this page. Everything else you entered is put back, but the groups/sections you selected can\'t be. ' +
        'You can continue and re-add them, or cancel, Save this register first, then come back and create the sessions.</p>' +
        '<div class="atg-btnrow"><button type="button" class="d2l-button atg-grp-cancel">Cancel</button><button type="button" class="d2l-button atg-grp-go" primary>Continue</button></div>', 'atg-grp-title');
      ui.setAttribute('role', 'alertdialog'); ui.setAttribute('aria-describedby', 'atg-grp-desc');
      ui.querySelector('.atg-grp-cancel').addEventListener('click', function () { closeModal(rs); });
      ui.querySelector('.atg-grp-go').addEventListener('click', function () { closeModal(rs); job.groupsOk = true; addMoreRows(rs, job, need, haveRows); });
      ui.querySelector('.atg-grp-go').focus();
      return;
    }
    if (job.rounds >= 6 || (job.lastRows === haveRows && job.rounds > 0)) {
      toastDoc(d, 'D2L didn\'t add the extra session rows. Click Add Sessions to add ' + need + ' more, then run ' + LBL.sessionsFromDates + ' again.');
      announce(d, 'Could not add session rows automatically.', true);
      return;
    }
    var n = Math.min(100, need);                                  // D2L adds up to 100 at a time
    var newRows = d.querySelectorAll('input[name^="name_new_"]').length;
    var next = { names: job.names, mode: job.mode, rounds: job.rounds + 1, lastRows: haveRows, groupsOk: !!job.groupsOk, snap: job.snap || snapshotForm(d) };
    if (w.D2L && typeof w.D2L.NavInfo === 'function' && w.Nav && typeof w.Nav.Go === 'function') {
      ssSet(jobKey(rs), JSON.stringify(next));
      toastDoc(d, 'Adding ' + n + ' session row' + (n === 1 ? '' : 's') + '…');
      try { w.onbeforeunload = null; } catch (e) {}
      var ni = new w.D2L.NavInfo();
      ni.action = 'Update';
      ni.actionParam = newRows + n;                                // same request D2L's Add Sessions makes
      w.Nav.Go(ni, true);
      return;
    }
    // Fallback: press D2L's own Add Sessions
    var ctl = regAddControls(d);
    if (!ctl) { toastDoc(d, 'Couldn\'t find Add Sessions. Add ' + need + ' rows, then run ' + LBL.sessionsFromDates + ' again.'); return; }
    if (ctl.num) setVal(w, ctl.num, String(n));
    ssSet(jobKey(rs), JSON.stringify(next));
    toastDoc(d, 'Adding ' + n + ' session row' + (n === 1 ? '' : 's') + '…');
    setTimeout(function () { ctl.add.click(); }, 80);
  }

  function finishJob(rs, n, rows) {
    ssSet(jobKey(rs), null);
    if (F.sessionDatePickers) {
      Array.prototype.forEach.call(rs.d.querySelectorAll('.atg-rowdate'), function (x) { x.remove(); });
      Array.prototype.forEach.call(rs.d.querySelectorAll('.atg-name-err'), function (x) { x.remove(); });
      addRowPickers(rs);
    }
    regRows(rs.d).forEach(function (r) { markName(rs, r.name, true); });
    toastDoc(rs.d, n + ' session' + (n === 1 ? '' : 's') + ' named with dates. Review them, then click Save.');
    var first = regRows(rs.d).filter(function (r) { return !rowDeleted(r); })[0];
    if (first) setTimeout(function () { try { first.name.focus(); } catch (e) {} }, 60);
  }

  /* ---------- Show the most learners per page D2L allows ---------- */
  // Returns the biggest "per page" option when the page isn't already using it, else null.
  function maxSizeNeeded(d) {
    var sizeSel = d.querySelector('select[name$="_sl_pgS1"]');
    if (!sizeSel) return null;
    var biggest = null;
    Array.prototype.forEach.call(sizeSel.options, function (o) {
      var v = parseInt(o.value, 10); if (!isNaN(v) && (!biggest || v > parseInt(biggest.value, 10))) biggest = o;
    });
    return biggest && biggest.value !== sizeSel.value ? { sel: sizeSel, value: biggest.value } : null;
  }
  // Switch D2L's own "Results Per Page" to the biggest option (D2L reloads the page).
  // Guarded so a page that refuses can never loop.
  function applyMaxSize(w, d, need, guardKey) {
    var last = parseInt(ssGet(guardKey) || '0', 10);
    if (Date.now() - last < 20000) return Promise.resolve(false);
    ssSet(guardKey, String(Date.now()));
    return waitFor(function () { return d.readyState === 'complete' && w.UI && (w.UI.GC || w.UI.GetByName); }, 8000)
      .catch(function () {})
      .then(function () { return d.defaultView ? setPageSizeNow(w, d, need.sel, need.value) : true; });
  }

  // D2L's "per page" dropdown runs  UI.GC('<grid id>').SetPageSize(value, true)  — that is what
  // reloads the list. Changing the dropdown's value alone does nothing, so call the grid directly.
  function setPageSizeNow(w, d, sel, value) {
    var grid = (sel && sel.closest && sel.closest('.d2l-grid-container') && sel.closest('.d2l-grid-container').querySelector('table.d2l-grid[id]')) ||
               d.querySelector('table.d2l-grid[id]');
    try {
      var g = grid && w.UI && typeof w.UI.GC === 'function' ? w.UI.GC(grid.id) : null;
      if (g && typeof g.SetPageSize === 'function') { sel.value = value; g.SetPageSize(value, true); return true; }
    } catch (e) {}
    // Fallback: run the dropdown's own D2L handler
    try {
      var ctl = w.UI && w.UI.GetByName ? w.UI.GetByName(sel.name) : null;
      if (ctl && typeof ctl.SelectOptionByKey === 'function') ctl.SelectOptionByKey(value, true);
    } catch (e) {}
    if (sel.value !== value) sel.value = value;
    try { sel.dispatchEvent(new w.Event('change', { bubbles: true })); } catch (e) {}
    return false;
  }

  /* ---------- Accessible menu button (WAI-ARIA menu button pattern) ----------
   * groups: [{ label, items: [{ value, text }] }]; onPick(value)
   * ------------------------------------------------------------------ */
  var menuSeq = 0;
  function menuButton(d, text, ariaLabel, groups, onPick, extraClass) {
    var id = 'atg-menu-' + (++menuSeq);
    var btn = d.createElement('button');
    btn.type = 'button'; btn.className = 'atg-mb' + (extraClass ? ' ' + extraClass : '');
    btn.setAttribute('aria-haspopup', 'menu'); btn.setAttribute('aria-expanded', 'false'); btn.setAttribute('aria-controls', id);
    if (ariaLabel) btn.setAttribute('aria-label', ariaLabel);
    btn.innerHTML = escapeHtml(text) + ' <span aria-hidden="true">▾</span>';
    var menu = null;
    var items = function () { return menu ? Array.prototype.slice.call(menu.querySelectorAll('[role="menuitem"]')) : []; };
    function close(refocus) {
      if (!menu) return;
      menu.remove(); menu = null;
      btn.setAttribute('aria-expanded', 'false');
      d.removeEventListener('mousedown', outside, true);
      d.defaultView && d.defaultView.removeEventListener('scroll', onScroll, true);
      if (refocus) btn.focus();
    }
    function outside(e) { if (menu && !menu.contains(e.target) && e.target !== btn && !btn.contains(e.target)) close(false); }
    function onScroll(e) { if (menu && !menu.contains(e.target)) close(false); }
    function open(focusLast) {
      if (menu) return;
      menu = d.createElement('ul'); menu.id = id; menu.className = 'atg-menu'; menu.setAttribute('role', 'menu');
      menu.setAttribute('aria-label', ariaLabel || text);
      groups.forEach(function (g, gi) {
        if (gi > 0) { var sep = d.createElement('li'); sep.setAttribute('role', 'separator'); sep.className = 'atg-menu-sep'; menu.appendChild(sep); }
        var host = menu;
        if (g.label) {
          var gli = d.createElement('li'); gli.setAttribute('role', 'none');
          var gh = d.createElement('div'); gh.className = 'atg-menu-gh'; gh.id = id + '-g' + gi; gh.textContent = g.label; gh.setAttribute('aria-hidden', 'true');
          var gul = d.createElement('ul'); gul.setAttribute('role', 'group'); gul.setAttribute('aria-label', g.label);
          gli.appendChild(gh); gli.appendChild(gul); menu.appendChild(gli); host = gul;
        }
        g.items.forEach(function (it) {
          var li = d.createElement('li'); li.setAttribute('role', 'menuitem'); li.tabIndex = -1;
          li.setAttribute('data-value', it.value); li.textContent = it.text;
          if (it.label) li.setAttribute('aria-label', it.label);
          li.addEventListener('click', function (e) { e.stopPropagation(); close(true); onPick(it.value); });
          host.appendChild(li);
        });
      });
      d.body.appendChild(menu);
      var r = btn.getBoundingClientRect(), vw = d.documentElement.clientWidth || 800, vh = d.documentElement.clientHeight || 600;
      menu.style.left = Math.max(4, Math.min(r.left, vw - menu.offsetWidth - 8)) + 'px';
      var top = r.bottom + 2;
      if (top + menu.offsetHeight > vh - 8 && r.top - menu.offsetHeight - 2 > 4) top = r.top - menu.offsetHeight - 2;
      menu.style.top = top + 'px';
      btn.setAttribute('aria-expanded', 'true');
      d.addEventListener('mousedown', outside, true);
      d.defaultView && d.defaultView.addEventListener('scroll', onScroll, true);
      menu.addEventListener('keydown', onMenuKey);
      var list = items(); if (list.length) (focusLast ? list[list.length - 1] : list[0]).focus();
    }
    var typed = '', typedT;
    function onMenuKey(e) {
      var list = items(), i = list.indexOf(d.activeElement);
      switch (e.key) {
        case 'ArrowDown': e.preventDefault(); list[(i + 1) % list.length].focus(); return;
        case 'ArrowUp': e.preventDefault(); list[(i - 1 + list.length) % list.length].focus(); return;
        case 'Home': e.preventDefault(); list[0].focus(); return;
        case 'End': e.preventDefault(); list[list.length - 1].focus(); return;
        case 'Escape': e.preventDefault(); e.stopPropagation(); close(true); return;
        case 'Tab': close(false); return;
        case 'Enter': case ' ': e.preventDefault(); if (i >= 0) list[i].click(); return;
      }
      if (e.key.length === 1 && /\S/.test(e.key)) {          // type-ahead
        clearTimeout(typedT); typed += e.key.toLowerCase(); typedT = setTimeout(function () { typed = ''; }, 600);
        var hit = list.filter(function (x) { return x.textContent.toLowerCase().indexOf(typed) === 0; })[0];
        if (hit) hit.focus();
      }
    }
    btn.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); if (menu) close(true); else open(false); });
    btn.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); open(false); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); e.stopPropagation(); open(true); }
    });
    btn.__atgOpen = open; btn.__atgClose = close;
    return btn;
  }

  /* ---------- small helpers ---------- */
  function waitFor(test, timeout) {
    return new Promise(function (resolve, reject) {
      var t0 = Date.now();
      (function poll() {
        var ok = false; try { ok = !!test(); } catch (e) {}
        if (ok) return resolve();
        if (Date.now() - t0 > timeout) return reject(new Error('timeout'));
        setTimeout(poll, 150);
      })();
    });
  }
  function debounce(fn, ms) { var t; return function () { clearTimeout(t); t = setTimeout(fn, ms); }; }
  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, function (ch) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]; }); }

  function toast(state, text, isErr) {
    var d = state.d;
    var old = d.querySelector('.atg-toast'); if (old) old.remove();
    var t = d.createElement('div'); t.className = 'atg-toast' + (isErr ? ' atg-err' : ''); t.setAttribute('aria-hidden', 'true'); t.textContent = text;
    d.body.appendChild(t);
    announce(d, text, isErr);
    setTimeout(function () { t.remove(); }, 4500);
  }
  function modal(state, html, labelId) {
    var d = state.d;
    closeModal(state);
    var o = d.createElement('div'); o.className = 'atg-overlay';
    var box = d.createElement('div'); box.className = 'atg-modal'; box.setAttribute('role', 'dialog'); box.setAttribute('aria-modal', 'true');
    if (labelId) box.setAttribute('aria-labelledby', labelId);
    box.tabIndex = -1;
    box.innerHTML = html; o.appendChild(box); d.body.appendChild(o);
    o.__atgRelease = holdFocus(d, box, state.returnFocus);
    state.returnFocus = null;
    box.focus();
    return box;
  }
  function closeModal(state) {
    var o = state.d.querySelector('.atg-overlay');
    if (o) { if (o.__atgRelease) o.__atgRelease(); o.remove(); }
  }
  // Keep Tab inside a dialog and hand focus back where it was when the dialog closes.
  function holdFocus(d, box, returnTo) {
    var before = returnTo || d.activeElement;
    var onKey = function (e) {
      if (e.key !== 'Tab') return;
      var f = Array.prototype.filter.call(box.querySelectorAll('button,select,input,a[href],textarea,[tabindex]:not([tabindex="-1"])'), function (el) {
        return !el.disabled && el.offsetParent !== null || el === d.activeElement;
      });
      if (!f.length) { e.preventDefault(); box.focus(); return; }
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && (d.activeElement === first || d.activeElement === box)) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && d.activeElement === last) { e.preventDefault(); first.focus(); }
      else if (!box.contains(d.activeElement)) { e.preventDefault(); first.focus(); }
    };
    d.addEventListener('keydown', onKey, true);
    return function () {
      d.removeEventListener('keydown', onKey, true);
      try { if (before && before.focus && d.contains(before)) before.focus(); } catch (e) {}
    };
  }
  // One polite live region per page so every message is announced reliably.
  function announce(d, text, urgent) {
    var id = urgent ? 'atg-live-alert' : 'atg-live';
    var el = d.getElementById(id);
    if (!el) {
      el = d.createElement('div'); el.id = id; el.className = 'atg-sr';
      el.setAttribute('role', urgent ? 'alert' : 'status'); el.setAttribute('aria-live', urgent ? 'assertive' : 'polite');
      d.body.appendChild(el);
    }
    el.textContent = '';
    setTimeout(function () { el.textContent = text; }, 60);
  }

  // exposed for testing
  window.__ATG_TEST__ = { enhanceRegisterEdit: enhanceRegisterEdit, parseLooseDate: parseLooseDate, fmtDate: fmtDate, diagnostics: diagnostics, enhanceDataEdit: enhanceDataEdit, openGradesDialog: openGradesDialog, saveSession: saveSession, readModel: readModel, enhanceDataList: enhanceDataList, setOU: function (v) { OU = v; } };
})();
