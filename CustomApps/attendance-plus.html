<title>Attendance</title>
<!--
  Attendance Plus for D2L Brightspace
  -----------------------------------------------------------------------
  Created by Jonathan Sorrenti

  https://github.com/sponsors/jonsorr
  "Take Attendance by Grades" and "Create Sessions from Date Range" are based
  on code from Henry Ecker's "D2L Attendance From Participation" and
  "D2L Attendance Register Generator".
  D2L and Brightspace are trademarks of D2L Corporation. This is an
  independent community project, not affiliated with or endorsed by D2L.
  -----------------------------------------------------------------------
  A drop-in front door for the Brightspace Attendance tool.

  SETUP
    1. Upload this file to Public Files, e.g. /shared/CustomApps/attendance-plus.html
    2. In Navigation & Themes, point the course navbar's Attendance link
       (a Custom Link) at:   /shared/CustomApps/attendance-plus.html?ou={OrgUnitId}
       Same window. Brightspace replaces {OrgUnitId} with the course's org unit.

  HOW IT WORKS
    - Who sees what is decided by D2L itself: this page asks D2L's own
      Attendance link (/d2l/lms/attendance/index.d2l?ou=...) where it lands.
      Anyone D2L sends to the student view is sent straight to the real
      student page. No role names to configure, so it works at any college.
    - Everyone else gets the real D2L Attendance pages, shown full-window.
      Registers, Schemes, New Register, More Actions, Edit Data, student
      links, sorting, search, filters, Export and Email are all D2L's own.
    - On a register's Attendance Data page this adds: frozen Learner column,
      frozen session headings, "Display Totals at the front", and a
      Spreadsheet View whose Save runs D2L's own Save on each session's
      Set Attendance Data page, so Data Hub / reporting see normal D2L saves.
    - No API keys; everything runs as the signed-in user.

  SETTINGS are at the top of the script below (features on/off, wording, defaults).

  VERSION HISTORY
    1.6.0  New/Edit Register: Create Sessions from Date Range (from Henry Ecker's generator),
           pre-filled with the course's Start/End Date; a date picker beside every session name;
           standard date-name check on Save
    1.5.0  Take Attendance (any session, dates or names), at-risk flags from Cause for Concern,
           unsaved-mark recovery, Copy details on save problems, settings block, per-page fix
    1.4.0  Accessibility pass (WCAG 2.2 AA): menu buttons, dialog focus, announcements, contrast
    1.3.0  Take Attendance by Grades (from Henry Ecker's tool), bookmarklet pass-through
    1.2.0  Save waits for D2L, confirms every change, retries up to 3 times
    1.1.0  Chrome fix, opens at the left, top scrollbar, no "Resend" prompt
    1.0.0  Frozen panes, Totals first, Spreadsheet View
  -----------------------------------------------------------------------
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
  #atg-frame { border: 0; width: 100%; height: 100%; display: block; }
  #atg-boot {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; font: 15px/1.4 "Lato", "Segoe UI", Arial, sans-serif; color: #494c4e;
  }
  #atg-boot .spin {
    width: 34px; height: 34px; border-radius: 50%;
    border: 4px solid #e3e9f1; border-top-color: #006fbf; animation: atgspin .9s linear infinite;
  }
  @keyframes atgspin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #atg-boot .spin { animation-duration: 3s; } }
  #atg-boot a { color: #006fbf; }
  .atg-hidden-frame { position: absolute; width: 1px; height: 1px; left: -9999px; top: 0; border: 0; visibility: hidden; }
</style>
</head>
<body>
<div id="atg-boot" role="status" aria-live="polite"><div class="spin" aria-hidden="true"></div><div id="atg-boot-msg">Loading Attendance…</div></div>
<iframe id="atg-frame" title="Attendance" hidden></iframe>

<script>
(function () {
  'use strict';

  /* ================================================================== *
   *  SETTINGS — the only part most schools ever need to touch.
   *  Every value below is the default behavior; change it, save, re-upload.
   * ================================================================== */
  var VERSION = '1.6.0';
  var SETTINGS = {
    // ---- Features (true = on, false = off) ----
    features: {
      spreadsheetView:        true,   // "Switch to Spreadsheet View" on a register's Attendance Data page
      totalsFirstOption:      true,   // "Display Totals at the front of the table" checkbox
      frozenPanes:            true,   // frozen Learner column + session headings, top scrollbar
      takeAttendance:         true,   // "Take Attendance" button (pick any session, start everyone as P, fix exceptions)
      attendanceByGrades:     true,   // "Take Attendance by Grades" (Set Attendance Data page + spreadsheet icons)
      atRiskFlags:            true,   // flag learners below the register's Cause for Concern %
      draftRecovery:          true,   // keep unsaved spreadsheet marks in the browser until they're saved
      showMostLearnersPerPage: true,  // Spreadsheet View / Set Attendance Data switch to D2L's biggest "per page"
      sessionsFromDates:      true,   // New/Edit Register: "Create Sessions from Date Range" button
      sessionDatePickers:     true,   // New/Edit Register: a date picker beside every Session Name
      prefillCourseDates:     true,   // Create Sessions from Date Range starts with the course offering's Start/End Date
      bookmarkletPassThrough: true    // older bookmarklets clicked on this page run on the D2L page inside it
    },

    // ---- Button and label wording ----
    labels: {
      spreadsheet:    'Switch to Spreadsheet View',
      standard:       'Switch to Standard View',
      takeAttendance: 'Take Attendance',
      byGrades:       'Take Attendance by Grades',
      totalsFirst:    'Display Totals at the front of the table',
      save:           'Save',
      sessionsFromDates: 'Create Sessions from Date Range'
    },

    // ---- Defaults ----
    totalsFirstDefault: false,          // Totals checkbox for someone who has never touched it
    takeAttendanceStartWith: 'P',       // "Start everyone as" in Take Attendance ('' = leave blank); falls back to blank if the scheme has no such symbol
    gradeRuleDefaults: {                // Take Attendance by Grades, until a user changes them ('' = leave current mark as is)
      all: 'P',                         //   scored above 0 on every item
      some: 'T',                        //   scored above 0 on some items
      none: 'A',                        //   scored 0 on every item
      ungraded: ''                      //   any item not graded yet
    },
    atRiskDefaultPercent: null,         // used only when a register has no Cause for Concern % (null = no flags for those registers)
    draftKeepDays: 7,                   // how long unsaved spreadsheet marks are offered back

    // ---- Session names on New/Edit Register ----
    // One date format for every session name, so attendance can be matched by date
    // (e.g. by a student information system). Tokens: dddd ddd MMMM MMM MM M DD D YYYY YY
    sessionNames: {
      format: 'MMMM D, YYYY',           // August 28, 2026 (matches D2L's long date)
      autoFormat: true,                 // turn typed dates like 8/28/26 into the format above when the field is left
      check: 'warn'                     // on Save, names that aren't dates in that format: 'off' | 'warn' (can Save anyway) | 'require' (must fix)
    },
    // Dates every register skips (college holidays). Pre-filled, and removable, in Create Sessions from Date Range.
    // e.g. [{ from: '2026-11-25', to: '2026-11-27', label: 'Thanksgiving break' }, { from: '2026-11-03', label: 'Election Day' }]
    skipDates: [],

    // ---- Technical (rarely changed) ----
    attendanceRoot: '/d2l/lms/attendance/',
    saveTimeoutMs: 45000,               // max wait for one session's D2L save
    saveAttempts: 3,                    // automatic tries per session before reporting a change as not saved
    readyTimeoutMs: 30000               // max wait for a hidden D2L page to finish loading
  };
  var F = SETTINGS.features, LBL = SETTINGS.labels;

  /* ------------------------------------------------------------------ *
   *  Boot / routing
   * ------------------------------------------------------------------ */
  var params = new URLSearchParams(location.search);
  var OU = params.get('ou') || params.get('orgUnitId') || params.get('ouId') || '';
  var NATIVE_INDEX = SETTINGS.attendanceRoot + 'index.d2l?ou=' + encodeURIComponent(OU);
  var frame = document.getElementById('atg-frame');
  var bootMsg = document.getElementById('atg-boot-msg');

  function bootFail(html) {
    bootMsg.innerHTML = html;
    var s = document.querySelector('#atg-boot .spin'); if (s) s.remove();
  }

  // Opened from the navbar *inside* our own frame: just show the native tool there.
  if (window.top !== window.self) {
    try {
      if (window.top.location.pathname === location.pathname) { location.replace(NATIVE_INDEX); return; }
    } catch (e) { /* different origin parent: carry on as top-level */ }
  }

  if (!/^\d+$/.test(OU)) {
    bootFail('This page needs the course org unit in its address, e.g. <code>?ou={OrgUnitId}</code>.');
    return;
  }

  function isAttendancePath(p) { return p.toLowerCase().indexOf(SETTINGS.attendanceRoot) === 0; }

  function startPath() {
    var p = params.get('p');
    if (p && p.charAt(0) === '/' && isAttendancePath(p.split('?')[0])) return p;
    return NATIVE_INDEX;
  }

  fetch(NATIVE_INDEX, { credentials: 'same-origin', cache: 'no-store' })
    .then(function (res) { return res.text().then(function (html) { return { url: res.url || '', html: html }; }); })
    .then(function (r) {
      var finalPath = '';
      try { finalPath = new URL(r.url, location.href).pathname.toLowerCase(); } catch (e) {}
      var studentView = finalPath.indexOf('/attendance/view/') !== -1 || /my attendance<\/h1>|attendance_list\.d2l\?ou=/i.test(r.html);
      var staffView = /registers_list\.d2l|registers_newedit\.d2l|data_list\.d2l\?registerid=/i.test(finalPath + ' ' + r.html);
      if (staffView && !(/\/attendance\/view\//.test(finalPath))) {
        frame.hidden = false;
        frame.src = startPath();
      } else {
        // Students (or anything we can't classify) get exactly what D2L would show.
        location.replace(NATIVE_INDEX);
      }
    })
    .catch(function () { location.replace(NATIVE_INDEX); });

  frame.addEventListener('load', onFrameLoad);
  if (F.bookmarkletPassThrough) passBookmarkletsThrough();

  function onFrameLoad() {
    var w, d, loc;
    try { w = frame.contentWindow; d = w.document; loc = w.location; void loc.pathname; }
    catch (e) { location.href = NATIVE_INDEX; return; }       // left our origin

    // Chrome fires a load for the frame's initial blank document: ignore it.
    if (loc.href === 'about:blank' || loc.protocol === 'about:' || !frame.getAttribute('src')) return;

    // Left the Attendance tool (navbar, breadcrumb, etc.): become that page for real.
    if (!isAttendancePath(loc.pathname)) { location.href = loc.href; return; }

    var boot = document.getElementById('atg-boot'); if (boot) boot.remove();
    document.title = d.title || 'Attendance';
    frame.title = d.title || 'Attendance';
    try {
      var keep = new URL(location.href);
      keep.searchParams.set('ou', OU);
      keep.searchParams.set('p', loc.pathname + loc.search);
      history.replaceState(null, '', keep.pathname + keep.search);
    } catch (e) {}

    hookNavigation(w, d);
    if (/\/attendance\/attendance\/data_list\.d2l$/i.test(loc.pathname)) {
      try { enhanceDataList(w, d); } catch (err) { console.error('[Attendance Plus]', err); }
    } else if (/\/attendance\/attendance\/data_edit\.d2l$/i.test(loc.pathname)) {
      try { enhanceDataEdit(w, d); } catch (err) { console.error('[Attendance Plus]', err); }
    } else if (/\/attendance\/registers\/registers_newedit\.d2l$/i.test(loc.pathname)) {
      try { enhanceRegisterEdit(w, d); } catch (err) { console.error('[Attendance Plus]', err); }
    }
  }

  // Links that leave the Attendance tool open as a normal top-level page.
  function hookNavigation(w, d) {
    d.addEventListener('click', function (e) {
      if (e.defaultPrevented || e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey) return;
      var path = e.composedPath ? e.composedPath() : [e.target];
      var a = null;
      for (var i = 0; i < path.length; i++) {
        var n = path[i];
        if (n && n.tagName === 'A' && n.getAttribute && n.getAttribute('href')) { a = n; break; }
      }
      if (!a) return;
      var target = (a.getAttribute('target') || '').toLowerCase();
      if (target && target !== '_self' && target !== '_top' && target !== '_parent') return;
      var href = a.href;
      if (!href || /^javascript:/i.test(href) || href.charAt(href.length - 1) === '#') return;
      var u; try { u = new URL(href, w.location.href); } catch (er) { return; }
      if (u.origin !== location.origin || !isAttendancePath(u.pathname)) {
        e.preventDefault();
        location.href = u.href;
      }
    }, true);
  }

  /* ------------------------------------------------------------------ *
   *  Register "Attendance Data" page enhancements
   * ------------------------------------------------------------------ */
  var CSS = [

    '.atg-topbar{overflow-x:auto;overflow-y:hidden;height:16px;position:sticky;top:0;z-index:6;background:#fff;margin-bottom:2px;}',
    '.atg-topbar-inner{height:1px;}',
    '.atg-st{position:sticky!important;z-index:3;}',
    '.atg-sl{position:sticky!important;z-index:2;}',

    '.atg-hshadow{box-shadow:inset 0 -1px 0 #cdd5dc,0 6px 6px -5px rgba(0,0,0,.22)!important;}',
    '.atg-hshadow.atg-edge{box-shadow:inset -1px -1px 0 #cdd5dc,4px 4px 6px -4px rgba(0,0,0,.25)!important;}',
    '.atg-today-h{box-shadow:inset 0 -3px 0 #006fbf!important;}',
    '.atg-opts{display:flex;flex-wrap:wrap;align-items:center;gap:10px 28px;margin:14px 0 8px;font-size:.8rem;color:#202122;}',
    '.atg-opts label{display:inline-flex;align-items:center;gap:8px;cursor:pointer;}',

    '.atg-sel:focus{outline:2px solid #006fbf;outline-offset:1px;border-color:#006fbf;}',

    'td.atg-fail{outline:2px solid #cd2026;outline-offset:-2px;}',

  // Injected into D2L component shadow roots so the table scrolls in our box (both directions).
  var SHADOW_CSS = [
    ':host{overflow:visible!important;max-width:none!important;}',
    '.d2l-scroll-wrapper-container,[class*="scroll-wrapper-container"],.wrapper,.d2l-table-wrapper{overflow:visible!important;max-width:none!important;}',
    '.d2l-scroll-wrapper-actions,[class*="scroll-wrapper-actions"],.d2l-scroll-wrapper-button,[class*="scroll-wrapper-button"]{display:none!important;}'
  ].join('\n');

  var LS_TOTALS = 'atg.totalsFirst';
  function lsGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} }
  function ssGet(k) { try { return window.sessionStorage.getItem(k); } catch (e) { return null; } }
  function ssSet(k, v) { try { if (v == null) window.sessionStorage.removeItem(k); else window.sessionStorage.setItem(k, v); } catch (e) {} }

  function txt(el) { return el ? (el.textContent || '').replace(/\s+/g, ' ').trim() : ''; }

  function qpi(href, name) { // case-insensitive param lookup
    try {

  function enhanceDataList(w, d) {

    d.documentElement.setAttribute('data-atg', '1');

    var style = d.createElement('style'); style.id = 'atg-style'; style.textContent = CSS;
    (d.head || d.documentElement).appendChild(style);

    var registerId = qpi(w.location.href, 'registerId');

    if (!model) return;                      // no learners / unexpected page: leave D2L as-is

    var state = {
      w: w, d: d, model: model, registerId: registerId,
      mode: 'standard', totalsFirst: lsGet(LS_TOTALS) === null ? !!SETTINGS.totalsFirstDefault : lsGet(LS_TOTALS) === '1',
      changes: {}, undo: [], typeBuf: '', typeTimer: null
    };
    w.__atg = state;

    buildScroller(state);
    buildControls(state);
    if (state.totalsFirst && F.totalsFirstOption) moveTotals(state, true);
    if (F.frozenPanes) applySticky(state);
    scrollToToday(state);
    if (F.frozenPanes) buildTopbar(state);
    resetLeft(state);
    if (F.atRiskFlags) loadAtRisk(state);

    var relayout = debounce(function () { flattenShadows(state); sizeScroller(state); applySticky(state); sizeTopbar(state); }, 120);
    w.addEventListener('resize', relayout);
    if (w.ResizeObserver) { try { new w.ResizeObserver(relayout).observe(model.table); } catch (e) {} }
    [250, 800, 2000].forEach(function (t) { setTimeout(relayout, t); });
    // D2L/browser scroll restoration can push the table to the far right after load: put it back at the start.
    [0, 300, 900, 1800].forEach(function (t) { setTimeout(function () { if (!state.userScrolled) resetLeft(state); }, t); });
    ['wheel', 'pointerdown', 'keydown', 'touchstart'].forEach(function (ev) {

    });

      }
    });

  }

  /* ---------- Read the native grid ---------- */
  function readModel(w, d) {
    var tables = d.querySelectorAll('table');
    var table = null;
    for (var i = 0; i < tables.length; i++) {
      var t = tables[i];
      if (t.querySelector('a[href*="data_edit.d2l"]') && t.querySelector('th[scope="row"], th.d_ich')) { table = t; break; }
    }
    if (!table) return null;

    var rows = Array.prototype.slice.call(table.rows);
    var headRows = rows.filter(function (r) { return r.hasAttribute('header') || r.classList.contains('d_gh'); });
    var bodyRows = rows.filter(function (r) { return headRows.indexOf(r) === -1 && r.querySelector('th[scope="row"], th.d_ich'); });
    if (!headRows.length || !bodyRows.length) return null;

    var sessRow = null;
    headRows.forEach(function (r) { if (!sessRow && r.querySelector('a[href*="data_edit.d2l"]')) sessRow = r; });
    var groupRow = headRows[0] !== sessRow ? headRows[0] : null;

    var sessions = [];
    Array.prototype.forEach.call(sessRow.cells, function (c) {
      var a = c.querySelector('a[href*="data_edit.d2l"]');
      if (!a) return;
      var sortBtn = c.querySelector('d2l-table-col-sort-button');
      sessions.push({ th: c, id: qpi(a.href, 'SessionId'), name: txt(sortBtn) || txt(c) });
    });
    if (!sessions.length) return null;

    // Status list (id -> symbol) from D2L's own search-options dropdowns or the totals headers
    var statuses = [];
    var sel = d.querySelector('select[name="status"]') || d.querySelector('select[name="statusTotal"]');
    if (sel) {
      Array.prototype.forEach.call(sel.options, function (o) {
        if (o.value !== '-1' && o.value !== '' && txt(o)) statuses.push({ id: String(o.value), sym: txt(o) });
      });
    }
    if (!statuses.length) {
      Array.prototype.forEach.call(sessRow.querySelectorAll('[data-fieldname^="Symbol_"]'), function (b) {
        statuses.push({ id: b.getAttribute('data-fieldname').replace('Symbol_', ''), sym: txt(b) });
      });
    }
    var symToId = {}; statuses.forEach(function (s) { symToId[s.sym] = s.id; });

    var nS = sessions.length;
    var learners = bodyRows.map(function (r) {
      var th = r.querySelector('th[scope="row"], th.d_ich');
      var link = th.querySelector('a[href]');
      var uid = link ? qpi(link.href, 'userId') : '';
      if (!uid) { var cb = r.querySelector('input[type=checkbox][value]'); if (cb) uid = (cb.value.split('_')[1] || ''); }
      var first = r.cells[0] !== th ? r.cells[0] : null;
      var after = [], seen = false;
      Array.prototype.forEach.call(r.cells, function (c) { if (seen) after.push(c); if (c === th) seen = true; });
      return { row: r, th: th, cbCell: first, uid: uid, name: txt(link || th), sessionCells: after.slice(0, nS), totalCells: after.slice(nS) };
    });

    // header cells around the sessions
    var gCells = groupRow ? Array.prototype.slice.call(groupRow.cells) : [];
    var learnerHead = null, sessGroupHead = null, totalsGroupHeads = [], headCb = null;
    if (groupRow) {
      gCells.forEach(function (c) {
        if (!learnerHead && c.querySelector('d2l-table-col-sort-button[data-haschildren], d2l-table-col-sort-button-item')) learnerHead = c;
      });
      if (!learnerHead) learnerHead = gCells.filter(function (c) { return /learner/i.test(txt(c)); })[0] || gCells[1];
      headCb = gCells[0] !== learnerHead ? gCells[0] : null;
      var li = gCells.indexOf(learnerHead);
      sessGroupHead = gCells[li + 1] || null;
      totalsGroupHeads = gCells.slice(li + 2);
    }
    var sCells = Array.prototype.slice.call(sessRow.cells);
    var lastSessIdx = sCells.indexOf(sessions[nS - 1].th);
    var totalsHeads = sCells.slice(lastSessIdx + 1);
    if (!groupRow) { // single header row layout
      learnerHead = sCells.filter(function (c) { return /learner/i.test(txt(c)); })[0] || null;
      headCb = sCells[0] !== learnerHead ? sCells[0] : null;
    }

    return {
      table: table, wrapper: table.closest('d2l-table-wrapper') || null,
      groupRow: groupRow, sessRow: sessRow, headRows: headRows,
      headCb: headCb, learnerHead: learnerHead, sessGroupHead: sessGroupHead,
      totalsGroupHeads: totalsGroupHeads, totalsHeads: totalsHeads,
      sessions: sessions, statuses: statuses, symToId: symToId, learners: learners
    };
  }

  /* ---------- Frozen panes ---------- */
  function buildScroller(state) {
    var d = state.d, m = state.model;

    else { box.parentNode.insertBefore(sc, box); sc.appendChild(box); }

    sizeScroller(state);
  }

  function flattenShadows(state) {
    var root = state.model.wrapper;
    if (!root) return;
    (function walk(host) {
      var sr = host.shadowRoot;
      if (sr) {
        if (!sr.querySelector('style[data-atg]')) {
          var s = state.d.createElement('style'); s.setAttribute('data-atg', ''); s.textContent = SHADOW_CSS; sr.appendChild(s);
        }

    })(root);
  }

  function sizeScroller(state) {
    if (!F.frozenPanes) { state.scroller.style.overflow = 'visible'; return; }
    var w = state.w, d = state.d;
    var fb = d.querySelector('d2l-floating-buttons');
    var fbH = fb ? Math.max(fb.offsetHeight || 0, 64) : 0;
    var h = Math.max(320, w.innerHeight - fbH - 20);

  }

  function bgOf(w, el, fallback) {

    }

  function clearSticky(el) {
    el.classList.remove('atg-st', 'atg-sl', 'atg-edge', 'atg-hshadow');
    el.style.removeProperty('top'); el.style.removeProperty('left'); el.style.removeProperty('background-color');
  }

  function applySticky(state) {
    if (!F.frozenPanes) return;
    var w = state.w, m = state.model;
    Array.prototype.forEach.call(m.table.querySelectorAll('.atg-st,.atg-sl'), clearSticky);

    // columns to freeze: checkbox + Learner (header and body)
    var cbW = m.headCb ? m.headCb.offsetWidth : (m.learners[0].cbCell ? m.learners[0].cbCell.offsetWidth : 0);
    var leftFor = function (isCb) { return isCb ? 0 : cbW; };

    // header rows
    var top = 0;
    m.headRows.forEach(function (r, idx) {
      var rowTop = top;
      Array.prototype.forEach.call(r.cells, function (c) {
        c.classList.add('atg-st');
        // a rowspan cell in the first header row sits at 0

      });

      c.classList.add('atg-sl'); c.style.left = leftFor(isCb) + 'px';
      if (!isCb) c.classList.add('atg-edge');

    m.learners.forEach(function (L) {

      if (L.cbCell) { L.cbCell.classList.add('atg-sl'); L.cbCell.style.left = '0px'; L.cbCell.style.backgroundColor = bgOf(w, L.cbCell, bg); }
      L.th.classList.add('atg-sl', 'atg-edge'); L.th.style.left = cbW + 'px'; L.th.style.backgroundColor = bg;
    });
  }

  function scrollToToday(state) {
    var m = state.model, today = new Date(); today.setHours(0, 0, 0, 0);
    var hit = null, past = null;
    m.sessions.forEach(function (s) {
      var t = Date.parse(s.name.replace(/(\d+)(st|nd|rd|th)/, '$1'));
      if (isNaN(t)) return;

      }

  }

  function resetLeft(state) {
    state.scroller.scrollLeft = 0;
    if (state.topbar) state.topbar.scrollLeft = 0;
  }

  // Second horizontal scrollbar above the table, kept in sync with the table's own.

  function sizeTopbar(state) {
    if (!state.topbar) return;
    var sc = state.scroller;

    state.topbar.style.display = sc.scrollWidth > sc.clientWidth + 1 ? '' : 'none';
    state.topbar.scrollLeft = sc.scrollLeft;
  }

  /* ---------- Totals at the front ---------- */
  function moveTotals(state, first) {
    var m = state.model;
    if (!m.totalsHeads.length && !m.totalsGroupHeads.length) return;
    var put = function (cells, beforeEl, parent) {
      cells.forEach(function (c) { if (first) parent.insertBefore(c, beforeEl); else parent.appendChild(c); });
    };
    if (m.groupRow && m.sessGroupHead) put(m.totalsGroupHeads, m.sessGroupHead, m.groupRow);
    put(m.totalsHeads, m.sessions[0].th, m.sessRow);
    m.learners.forEach(function (L) {
      if (L.sessionCells.length) put(L.totalCells, L.sessionCells[0], L.row);
    });
    // keep D2L's first/last cell styling hooks correct
    [m.groupRow, m.sessRow].concat(m.learners.map(function (L) { return L.row; })).forEach(function (r) {
      if (!r) return;
      Array.prototype.forEach.call(r.cells, function (c, i) { c.classList.toggle('d2l-table-cell-last', i === r.cells.length - 1); });
    });
    state.totalsFirst = first;
  }

  /* ---------- Buttons and option row ---------- */
  function buildControls(state) {
    var d = state.d, m = state.model;

    // "Switch to Spreadsheet View" to the right of Email All Users
    var list = d.querySelector('.d2l-action-buttons-list');
    var btn = d.createElement('button');
    btn.type = 'button'; btn.className = 'd2l-button'; btn.textContent = LBL.spreadsheet;
    btn.addEventListener('click', function () { if (state.mode === 'sheet') leaveSheet(state); else enterSheet(state); });
    state.modeBtn = btn;
    var take = null;
    if (F.takeAttendance && F.spreadsheetView) {
      take = d.createElement('button');
      take.type = 'button'; take.className = 'd2l-button'; take.textContent = LBL.takeAttendance;
      take.addEventListener('click', function () { openTakeDialog(state, take); });
      state.takeBtn = take;
    }
    if (list) {
      var emailLi = null;
      Array.prototype.forEach.call(list.children, function (x) { if (/email all users/i.test(txt(x))) emailLi = x; });
      var after = emailLi;
      [F.spreadsheetView ? btn : null, take].forEach(function (b) {
        if (!b) return;
        var li = d.createElement('li'); li.className = 'd2l-action-buttons-item'; li.appendChild(b);
        if (after && after.nextSibling) list.insertBefore(li, after.nextSibling); else list.appendChild(li);
        after = li;
      });
    } else if (F.spreadsheetView) {
      m.table.parentNode.insertBefore(btn, m.table);
    }

    // Option row: below the search box, above the grid's Email action
    var opts = d.createElement('div'); opts.className = 'atg-opts';
    opts.innerHTML =
      (F.totalsFirstOption ? '<label><input type="checkbox" class="d2l-checkbox atg-tf"> ' + escapeHtml(LBL.totalsFirst) + '</label>' : '') +
      '<span class="atg-risk" hidden></span>' +
      '<span class="atg-bar">' +
        '<span class="atg-count">No unsaved changes</span>' +
        '<button type="button" class="atg-link atg-undo" disabled>Undo</button>' +
        '<button type="button" class="atg-link atg-all" hidden></button>' +
        '<span class="atg-tip" id="atg-sheet-tip">Type a symbol (' + m.statuses.slice(0, 4).map(function (s) { return s.sym; }).join(', ') + (m.statuses.length > 4 ? '…' : '') + ') to mark and move down · arrow keys move · Ctrl+Z undoes</span>' +
      '</span>';
    var tf = opts.querySelector('.atg-tf') || d.createElement('input');
    tf.checked = state.totalsFirst;
    tf.addEventListener('change', function () {
      lsSet(LS_TOTALS, tf.checked ? '1' : '0');
      moveTotals(state, tf.checked);
      applySticky(state);
      sizeTopbar(state);
    });
    opts.querySelector('.atg-undo').addEventListener('click', function () { undo(state); });
    state.opts = opts;

    // D2L pages this grid (e.g. 20 per page). Offer one-click "all on one page" using D2L's own setting.
    var pgSel = d.querySelector('select[name$="_sl_pg1"]');
    var sizeSel = d.querySelector('select[name$="_sl_pgS1"]');
    var allBtn = opts.querySelector('.atg-all');
    state.multiPage = !!(pgSel && pgSel.options.length > 1);
    if (pgSel && sizeSel && pgSel.options.length > 1) {
      var biggest = null;
      Array.prototype.forEach.call(sizeSel.options, function (o) { var v = parseInt(o.value, 10); if (!isNaN(v) && (!biggest || v > parseInt(biggest.value, 10))) biggest = o; });
      if (biggest && biggest.value !== sizeSel.value) {
        allBtn.hidden = false;
        allBtn.textContent = 'Page ' + (pgSel.selectedIndex + 1) + ' of ' + pgSel.options.length + ' — show all learners on one page';
        allBtn.addEventListener('click', function () {
          if (changeCount(state) && !state.w.confirm('Save first? Changing pages discards unsaved changes. Click OK to discard and continue.')) return;
          state.changes = {}; updateBar(state);
          setPageSizeNow(state.w, state.d, sizeSel, biggest.value);
        });
      }
    }

    var gridActs = d.querySelector('.d2l-grid-actions-container');
    var anchor = gridActs ? (gridActs.closest('table.d_gact') || gridActs) : state.scroller;
    // the outer d_gact table is the one directly before the grid
    var outer = anchor;
    while (outer && outer.parentElement && outer.parentElement.closest && outer.parentElement.closest('table.d_gact')) outer = outer.parentElement.closest('table.d_gact');
    outer.parentNode.insertBefore(opts, outer);

    // Floating bar: our Save sits where Done is
    var fb = d.querySelector('d2l-floating-buttons');
    if (fb) {
      var done = null;
      Array.prototype.forEach.call(fb.querySelectorAll('button'), function (b) { if (!done && /done/i.test(txt(b))) done = b; });
      if (!done) done = fb.querySelector('button');
      var save = d.createElement('button');
      save.type = 'button'; save.className = 'd2l-button'; save.setAttribute('primary', '');
      save.style.cssText = 'float:left;display:none;';
      save.textContent = LBL.save;
      save.addEventListener('click', function () { saveAll(state); });
      if (done) done.parentNode.insertBefore(save, done); else fb.insertBefore(save, fb.firstChild);
      state.doneBtn = done; state.saveBtn = save;
    } else {
      var save2 = d.createElement('button');
      save2.type = 'button'; save2.className = 'd2l-button'; save2.setAttribute('primary', ''); save2.textContent = 'Save';
      save2.style.cssText = 'position:fixed;left:20px;bottom:16px;z-index:50;display:none;';
      save2.addEventListener('click', function () { saveAll(state); });
      d.body.appendChild(save2); state.saveBtn = save2;
    }
  }

  /* ---------- Spreadsheet view ---------- */
  function key(uid, sid) { return uid + '|' + sid; }
  function changeCount(state) { return Object.keys(state.changes).length; }

  function enterSheet(state) {
    if (state.mode === 'sheet' || state.entering) return;
    var need = F.showMostLearnersPerPage ? maxSizeNeeded(state.d) : null;
    var guard = 'atg.size.list.' + state.registerId;
    var last = parseInt(ssGet(guard) || '0', 10);
    if (need && Date.now() - last >= 20000) {
      state.entering = true;
      ssSet('atg.sheet.' + state.registerId, '1');            // come back in Spreadsheet View after D2L reloads
      toast(state, 'Showing all learners on one page…');
      applyMaxSize(state.w, state.d, need, guard).then(function () {
        // if D2L didn't reload, carry on with the learners we have
        setTimeout(function () { if (state.d.defaultView && state.mode !== 'sheet') { state.entering = false; buildSheet(state); } }, 4000);
      });
      return;
    }
    buildSheet(state);
  }

  function buildSheet(state) {
    if (state.mode === 'sheet') return;
    state.entering = false;
    var d = state.d, m = state.model;
    state.mode = 'sheet';
    state.changes = {}; state.undo = [];
    d.body.classList.add('atg-sheet');
    ssSet('atg.sheet.' + state.registerId, '1');

    m.learners.forEach(function (L, r) {
      L.sessionCells.forEach(function (cell, c) {
        var label = cell.querySelector('label') || cell;
        var shown = txt(label);
        var orig = shown === '-' || shown === '' ? '0' : (m.symToId[shown] || ('?' + shown));
        cell.setAttribute('data-atg-orig', orig);
        var sel = d.createElement('select');
        sel.className = 'atg-sel';
        sel.setAttribute('aria-label', L.name + ', ' + m.sessions[c].name);
        sel.setAttribute('data-r', r); sel.setAttribute('data-c', c);
        var html = '<option value="0">–</option>';
        m.statuses.forEach(function (s) { html += '<option value="' + s.id + '">' + escapeHtml(s.sym) + '</option>'; });
        if (orig.charAt(0) === '?') html += '<option value="' + escapeHtml(orig) + '">' + escapeHtml(shown) + '</option>';
        sel.innerHTML = html;
        sel.value = orig;
        if (label !== cell) label.style.display = 'none';
        cell.appendChild(sel);
        sel.addEventListener('change', function () { setCell(state, r, c, sel.value, true); });
        sel.addEventListener('keydown', function (e) { onCellKey(state, e, r, c); });
        sel.addEventListener('focus', function () { revealCell(state, sel); });
      });
    });

    m.sessions.forEach(function (s, c) {
      var groups = [
        { label: 'Set everyone to', items: m.statuses.map(function (st) { return { value: 's:' + st.id, text: st.sym, label: 'Set everyone to ' + st.sym }; })
            .concat([{ value: 's:0', text: '– (none)', label: 'Set everyone to no status' }]) },
        { label: 'Fill blanks only with', items: m.statuses.map(function (st) { return { value: 'f:' + st.id, text: st.sym, label: 'Fill blanks only with ' + st.sym }; }) }
      ];
      if (c > 0) groups.push({ label: 'Other', items: [{ value: 'copy', text: 'Copy previous session' }] });
      var col = menuButton(d, 'Set column', 'Set column for ' + s.name, groups, function (v) { columnAction(state, c, v); }, 'atg-col');
      s.th.appendChild(col);
    });

    if (F.attendanceByGrades) addGradeButtons(state);
    state.scroller.setAttribute('aria-describedby', 'atg-sheet-tip');
    announce(d, 'Spreadsheet View. Each attendance cell is a dropdown. Type a symbol to mark and move down, use arrow keys to move, and Save when done.');
    state.modeBtn.textContent = LBL.standard;
    if (state.doneBtn) state.doneBtn.style.display = 'none';
    if (state.saveBtn) state.saveBtn.style.display = '';
    state.mode = 'sheet';
    updateBar(state, true);
    applySticky(state);
    sizeTopbar(state);
    offerDraft(state, function () { runPendingTake(state); });
  }

  function leaveSheet(state, force) {
    if (state.mode !== 'sheet') return;
    var n = changeCount(state);
    if (n && !force && !state.w.confirm('You have ' + n + ' unsaved change' + (n === 1 ? '' : 's') + '. Switch to Standard View and discard them?')) return;
    var d = state.d, m = state.model;
    m.learners.forEach(function (L) {
      L.sessionCells.forEach(function (cell) {
        var sel = cell.querySelector('.atg-sel'); if (sel) sel.remove();
        var label = cell.querySelector('label'); if (label) label.style.display = '';
        cell.classList.remove('atg-dirty', 'atg-fail');
        cell.removeAttribute('data-atg-orig');
      });
    });
    Array.prototype.forEach.call(m.table.querySelectorAll('.atg-col, .atg-gbtn'), function (x) { x.remove(); });
    state.mode = 'standard'; state.changes = {}; state.undo = [];
    clearDraft(state);
    d.body.classList.remove('atg-sheet');
    ssSet('atg.sheet.' + state.registerId, null);
    state.modeBtn.textContent = LBL.spreadsheet;
    state.scroller.removeAttribute('aria-describedby');
    announce(d, 'Standard View.');
    if (state.doneBtn) state.doneBtn.style.display = '';
    if (state.saveBtn) state.saveBtn.style.display = 'none';
    applySticky(state);
    sizeTopbar(state);
  }

  function cellSel(state, r, c) {
    var L = state.model.learners[r]; if (!L) return null;
    var cell = L.sessionCells[c]; return cell ? cell.querySelector('.atg-sel') : null;
  }

  // returns previous value
  function setCell(state, r, c, val, record) {
    var m = state.model, L = m.learners[r], cell = L.sessionCells[c], sel = cell.querySelector('.atg-sel');
    var orig = cell.getAttribute('data-atg-orig');
    var k = key(L.uid, m.sessions[c].id);
    var prev = state.changes[k] ? state.changes[k].val : orig;
    if (sel.value !== String(val)) sel.value = String(val);
    if (String(val) === orig) { delete state.changes[k]; cell.classList.remove('atg-dirty'); }
    else { state.changes[k] = { r: r, c: c, uid: L.uid, sid: m.sessions[c].id, val: String(val) }; cell.classList.add('atg-dirty'); }
    cell.classList.remove('atg-fail');
    describeCell(state, cell);
    if (record && prev !== String(val)) { state.undo.push([{ r: r, c: c, prev: prev }]); }
    updateBar(state);
    return prev;
  }

  // Screen readers hear "unsaved change" / "not saved" on a cell, not just a color.
  function describeCell(state, cell) {
    var d = state.d, sel = cell.querySelector('.atg-sel'); if (!sel) return;
    ['atg-desc-dirty', 'atg-desc-fail'].forEach(function (id, i) {
      if (!d.getElementById(id)) {
        var el = d.createElement('span'); el.id = id; el.className = 'atg-sr';
        el.textContent = i ? 'Not saved. Try Save again.' : 'Unsaved change.'; d.body.appendChild(el);
      }
    });
    var ids = [];
    if (cell.classList.contains('atg-fail')) ids.push('atg-desc-fail');
    else if (cell.classList.contains('atg-dirty')) ids.push('atg-desc-dirty');
    if (ids.length) sel.setAttribute('aria-describedby', ids.join(' ')); else sel.removeAttribute('aria-describedby');
  }

  // Keep a focused cell from hiding under the frozen Learner column or headings.
  function revealCell(state, el) {
    var sc = state.scroller, m = state.model; if (!sc || !el) return;
    var cell = el.closest('td,th') || el;
    var frozenL = (m.headCb ? m.headCb.offsetWidth : 0) + (m.learnerHead ? m.learnerHead.offsetWidth : 0);
    var headH = 0; m.headRows.forEach(function (r) { headH += r.offsetHeight; });
    var sr = sc.getBoundingClientRect(), cr = cell.getBoundingClientRect();
    if (cr.left < sr.left + frozenL) sc.scrollLeft -= (sr.left + frozenL - cr.left) + 8;
    else if (cr.right > sr.right) sc.scrollLeft += (cr.right - sr.right) + 8;
    if (cr.top < sr.top + headH) sc.scrollTop -= (sr.top + headH - cr.top) + 4;
    else if (cr.bottom > sr.bottom) sc.scrollTop += (cr.bottom - sr.bottom) + 4;
  }

  function columnAction(state, c, action) {
    if (!action) return;
    var m = state.model, batch = [];
    m.learners.forEach(function (L, r) {
      if (L.row.offsetParent === null && L.row.style.display === 'none') return; // hidden rows untouched
      var sel = L.sessionCells[c].querySelector('.atg-sel');
      var cur = sel.value, next = null;
      if (action.indexOf('s:') === 0) next = action.slice(2);
      else if (action.indexOf('f:') === 0) { if (cur === '0') next = action.slice(2); }
      else if (action === 'copy') {
        var ps = L.sessionCells[c - 1].querySelector('.atg-sel');
        if (ps && ps.value.charAt(0) !== '?') next = ps.value;
      }
      if (next !== null && next !== cur) { batch.push({ r: r, c: c, prev: setCell(state, r, c, next, false) }); }
    });
    if (batch.length) state.undo.push(batch);
    toast(state, batch.length ? (batch.length + ' cell' + (batch.length === 1 ? '' : 's') + ' changed in ' + m.sessions[c].name + (state.multiPage ? ' (this page of learners)' : '') + '. Click Save to keep them.') : 'Nothing to change in that column.');
    updateBar(state);
  }

  function undo(state) {
    var batch = state.undo.pop();
    if (!batch) return;
    for (var i = batch.length - 1; i >= 0; i--) setCell(state, batch[i].r, batch[i].c, batch[i].prev, false);
    var s = cellSel(state, batch[0].r, batch[0].c); if (s) s.focus();
    updateBar(state);
  }

  function updateBar(state, skipDraft) {
    if (state.mode === 'sheet' && !skipDraft && !state.draftPending) saveDraft(state);
    if (!state.opts) return;
    var n = changeCount(state);
    var cnt = state.opts.querySelector('.atg-count');
    cnt.textContent = n ? (n + ' unsaved change' + (n === 1 ? '' : 's')) : 'No unsaved changes';
    cnt.classList.toggle('atg-has', n > 0);
    state.opts.querySelector('.atg-undo').disabled = !state.undo.length;
  }

  function onCellKey(state, e, r, c) {
    var m = state.model;
    var move = function (dr, dc) {
      var nr = r + dr, nc = c + dc;
      if (nr < 0 || nc < 0 || nr >= m.learners.length || nc >= m.sessions.length) return;
      var s = cellSel(state, nr, nc); if (s) s.focus();
    };
    if (e.altKey && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) return;     // native dropdown
    if (e.ctrlKey || e.metaKey) return;
    switch (e.key) {
      case 'ArrowDown': case 'Enter': e.preventDefault(); move(1, 0); return;
      case 'ArrowUp': e.preventDefault(); move(-1, 0); return;
      case 'ArrowLeft': e.preventDefault(); move(0, -1); return;
      case 'ArrowRight': e.preventDefault(); move(0, 1); return;
      case 'Delete': case 'Backspace': case '-': e.preventDefault(); setCell(state, r, c, '0', true); return;
      case 'Tab': return;
    }
    if (e.key && e.key.length === 1 && /\S/.test(e.key)) {
      e.preventDefault();
      clearTimeout(state.typeTimer);
      var buf = (state.typeBuf + e.key).toLowerCase();
      var cands = m.statuses.filter(function (s) { return s.sym.toLowerCase().indexOf(buf) === 0; });
      if (!cands.length) { buf = e.key.toLowerCase(); cands = m.statuses.filter(function (s) { return s.sym.toLowerCase().indexOf(buf) === 0; }); }
      if (!cands.length) { state.typeBuf = ''; return; }
      var exact = cands.filter(function (s) { return s.sym.toLowerCase() === buf; })[0];
      var commit = function (s) { state.typeBuf = ''; setCell(state, r, c, s.id, true); move(1, 0); };
      if (cands.length === 1) { commit(cands[0]); return; }
      state.typeBuf = buf;
      if (exact) state.typeTimer = setTimeout(function () { commit(exact); }, 650);
      else state.typeTimer = setTimeout(function () { state.typeBuf = ''; }, 900);
    }
  }

  /* ---------- Save through D2L's own Set Attendance Data page ---------- */
  function saveAll(state) {
    if (state.saving) return;
    var m = state.model, list = Object.keys(state.changes).map(function (k) { return state.changes[k]; });
    if (!list.length) { toast(state, 'No changes to save.'); return; }

    var bySession = [];
    m.sessions.forEach(function (s) {
      var items = list.filter(function (x) { return x.sid === s.id; });
      if (items.length) bySession.push({ session: s, items: items });
    });

    state.saving = true;
    state.returnFocus = state.saveBtn;
    var ui = modal(state, '<h2 id="atg-save-title">Saving attendance…</h2><div class="atg-msg" role="status" aria-live="polite"></div>' +
      '<div class="atg-prog" role="progressbar" aria-labelledby="atg-save-title" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div></div></div>', 'atg-save-title');
    var msg = ui.querySelector('.atg-msg'), bar = ui.querySelector('.atg-prog > div'), pb = ui.querySelector('.atg-prog');
    var setPct = function (pct) { bar.style.width = pct + '%'; pb.setAttribute('aria-valuenow', String(pct)); };
    var failed = [], i = 0;

    (function next() {
      if (i >= bySession.length) return finish();
      var job = bySession[i];
      msg.textContent = 'Session ' + (i + 1) + ' of ' + bySession.length + ': ' + job.session.name + ' (' + job.items.length + ' change' + (job.items.length === 1 ? '' : 's') + ')';
      setPct(Math.round(i / bySession.length * 100));
      saveSession(job.session.id, job.items, function (n, count) {
        msg.textContent = job.session.name + ': D2L didn\'t take ' + count + ' change' + (count === 1 ? '' : 's') + ' — trying again (attempt ' + n + ' of ' + SETTINGS.saveAttempts + ')…';
      }).then(function (res) {
        res.failed.forEach(function (f) { failed.push(f); });
        i++; next();
      }, function (err) {
        job.items.forEach(function (x) { failed.push({ item: x, why: (err && err.message) || 'Save did not complete' }); });
        i++; next();
      });
    })();

    function finish() {
      setPct(100);
      state.saving = false;
      var okCount = list.length - failed.length;
      if (!failed.length) {
        closeModal(state);
        state.changes = {};
        clearDraft(state);
        toast(state, 'Saved ' + okCount + ' change' + (okCount === 1 ? '' : 's') + '. Refreshing…');
        setTimeout(function () { refreshPage(state); }, 450);   // stays in Spreadsheet View
        return;
      }
      // Keep only the failed ones as unsaved; mark them
      var keep = {};
      failed.forEach(function (f) { keep[key(f.item.uid, f.item.sid)] = true; });
      list.forEach(function (x) {
        var k = key(x.uid, x.sid), cell = m.learners[x.r].sessionCells[x.c];
        if (keep[k]) { cell.classList.add('atg-fail'); }
        else { cell.setAttribute('data-atg-orig', x.val); cell.classList.remove('atg-dirty'); delete state.changes[k]; }
        describeCell(state, cell);
      });
      state.undo = [];
      updateBar(state);
      var lis = failed.slice(0, 40).map(function (f) {
        return '<li>' + escapeHtml(m.learners[f.item.r].name) + ' – ' + escapeHtml(m.sessions[f.item.c].name) + ': ' + escapeHtml(f.why) + '</li>';
      }).join('');
      ui.setAttribute('role', 'alertdialog');
      ui.setAttribute('aria-describedby', 'atg-fail-desc');
      ui.innerHTML = '<h2 id="atg-save-title">' + okCount + ' saved, ' + failed.length + ' not saved</h2>' +
        '<div id="atg-fail-desc">D2L didn\'t keep these after 3 tries. They\'re still marked in the table. Click Save to try again, or use that session\'s Edit Data button.</div><ul>' + lis + '</ul>' +
        '<div class="atg-btnrow"><button type="button" class="d2l-button atg-copy">Copy details</button><button type="button" class="d2l-button atg-ok" primary>OK</button></div>';
      var okBtn = ui.querySelector('.atg-ok');
      okBtn.addEventListener('click', function () { closeModal(state); });
      ui.querySelector('.atg-copy').addEventListener('click', function () {
        copyText(state.d, diagnostics(state, failed, okCount), function (ok) {
          announce(state.d, ok ? 'Details copied. Paste them into your help desk ticket.' : 'Could not copy. Select the list and copy it instead.');
          toast(state, ok ? 'Details copied — paste them into a help desk ticket.' : 'Could not copy automatically.', !ok);
        });
      });
      okBtn.focus();
    }
  }

  // Save one session through D2L's own Set Attendance Data page, retrying on its own.
  // Resolves { failed: [{ item, why }] } — never rejects.
  function saveSession(sessionId, items, onRetry) {
    var attempt = 1, hard = [];
    function run(list) {
      return saveOnce(sessionId, list).then(function (res) {
        res.failed.forEach(function (f) { if (!f.retry) hard.push(f); });
        var again = res.failed.filter(function (f) { return f.retry; });
        if (again.length && attempt < SETTINGS.saveAttempts) {
          attempt++;
          if (onRetry) onRetry(attempt, again.length);
          return sleep(800 * attempt).then(function () { return run(again.map(function (f) { return f.item; })); });
        }
        return { failed: hard.concat(again) };
      });
    }
    return run(items);
  }

  function saveOnce(sessionId, items) {
    var url = SETTINGS.attendanceRoot + 'attendance/data_edit.d2l?SessionId=' + encodeURIComponent(sessionId) + '&ou=' + encodeURIComponent(OU);
    var f = document.createElement('iframe');
    f.className = 'atg-hidden-frame';
    f.setAttribute('aria-hidden', 'true'); f.tabIndex = -1;
    document.body.appendChild(f);
    var all = function (why) { return { failed: items.map(function (x) { return { item: x, why: why, retry: true }; }) }; };
    var hard = [], pending = [];

    return loadInto(f, url)
      .then(function (ew) { return whenD2LReady(ew).then(function () { return ew; }); })
      .then(function (ew) {
        // 1. set the values (D2L's control, then the element, then a change event like a real pick)
        var ed = ew.document;
        items.forEach(function (x) {
          var sel = ed.querySelector('select[name="SL_Status_' + x.uid + '"]');
          if (!sel) { hard.push({ item: x, why: 'learner not on the Set Attendance Data page (check its section filter)' }); return; }
          if (!Array.prototype.some.call(sel.options, function (o) { return o.value === x.val; })) { hard.push({ item: x, why: 'status not in this session\'s scheme' }); return; }
          setD2LSelect(ew, sel, x.val);
          pending.push({ item: x, sel: sel });
        });
        if (!pending.length) return null;
        // 2. let D2L settle, then re-check and re-apply anything D2L put back
        return sleep(350).then(function () {
          pending.forEach(function (p) { if (p.sel.value !== p.item.val) setD2LSelect(ew, p.sel, p.item.val); });
          pending = pending.filter(function (p) {
            if (p.sel.value === p.item.val) return true;
            hard.push({ item: p.item, why: 'D2L would not accept the value', retry: true }); return false;
          });
          if (!pending.length) return null;
          // 3. make sure D2L sends every one of these, even if it thinks nothing changed
          pending.forEach(function (p) { forceInclude(ew, p.sel); });
          return submitD2L(ew, f);
        });
      })
      .then(function (ok) {
        if (ok === null) return { failed: hard };
        if (!ok) return { failed: hard.concat(pending.map(function (p) { return { item: p.item, why: 'D2L reported a problem while saving', retry: true }; })) };
        // 4. open the page fresh and confirm D2L kept every change
        return loadInto(f, url).then(function (vw) {
          return waitFor(function () { return vw.document.querySelector('select[name^="SL_Status_"]'); }, 15000).then(function () {
            var notKept = [];
            pending.forEach(function (p) {
              var sel = vw.document.querySelector('select[name="SL_Status_' + p.item.uid + '"]');
              if (!sel || sel.value !== p.item.val) notKept.push({ item: p.item, why: 'D2L did not keep the change', retry: true });
            });
            return { failed: hard.concat(notKept) };
          });
        });
      })
      .catch(function (err) { return all((err && err.message) || 'Save did not complete'); })
      .then(function (res) { setTimeout(function () { f.remove(); }, 0); return res; });
  }

  // Navigate a hidden frame and resolve with its window once a real (non-blank) page has loaded.
  function loadInto(f, url) {
    return new Promise(function (resolve, reject) {
      var timer = setTimeout(function () { f.removeEventListener('load', onLoad); reject(new Error('D2L did not respond in time')); }, SETTINGS.readyTimeoutMs);
      function onLoad() {
        var w; try { w = f.contentWindow; void w.location.href; } catch (e) { return; }
        if (w.location.href === 'about:blank') return;
        clearTimeout(timer); f.removeEventListener('load', onLoad); resolve(w);
      }
      f.addEventListener('load', onLoad);
      var full = url + (url.indexOf('?') === -1 ? '?' : '&') + 'atg=' + Date.now();   // always a fresh GET
      f.src = full;
    });
  }

  // D2L sets its dropdowns up after the page loads; values set before that are ignored.
  // Wait for that setup to finish: page complete, web components ready, and the grid
  // (registered after every dropdown) known to D2L.
  function whenD2LReady(ew) {
    return waitFor(function () {
      var ed = ew.document;
      return ed.readyState === 'complete' && ew.UI && typeof ew.UI.GetByName === 'function' &&
             ed.querySelector('select[name^="SL_Status_"]') && ew.UI.GetByName('GRID_data') &&
             ew.UI.GetByName(ed.querySelector('select[name^="SL_Status_"]').name) &&
             ((ew.D2L && ew.D2L.Rpc && typeof ew.D2L.Rpc.CreatePost === 'function') || typeof ew.callForUpdate === 'function');
    }, SETTINGS.readyTimeoutMs).then(function () {
      var wcr = ew.D2L && ew.D2L.WebComponentsReady;
      var ready = wcr && typeof wcr.then === 'function' ? wcr : Promise.resolve();
      return Promise.race([ready, sleep(5000)]);
    }).then(function () { return sleep(400); });
  }

  function setD2LSelect(ew, sel, val) {
    var ctl = null; try { ctl = ew.UI.GetByName(sel.name); } catch (e) {}
    try { if (ctl && typeof ctl.SelectOptionByKey === 'function') ctl.SelectOptionByKey(val, true); } catch (e) {}
    if (sel.value !== val) sel.value = val;
    try { sel.dispatchEvent(new ew.Event('change', { bubbles: true })); } catch (e) {}
  }

  // Tell D2L's change tracker to send this dropdown even if its "original value" looks the same.
  function forceInclude(ew, sel) {
    try {
      var mgr = ew.D2L && ew.D2L.MultiEdit && ew.D2L.MultiEdit.GetManager && ew.D2L.MultiEdit.GetManager();
      var list = mgr && mgr.m_controls; if (!list) return false;
      var ctl = null; try { ctl = ew.UI.GetByName(sel.name); } catch (e) {}
      var hit = false;
      Object.keys(list).forEach(function (k) {
        var mc = list[k]; if (!mc || typeof mc.GetControl !== 'function') return;
        var c = null; try { c = mc.GetControl(); } catch (e) {}
        var node = null; try { node = c && c.GetDomNode && c.GetDomNode(); } catch (e) {}
        if (c && (c === ctl || node === sel) && typeof mc.SetIncludeWhenUnchanged === 'function') { mc.SetIncludeWhenUnchanged(true); hit = true; }
      });
      return hit;
    } catch (e) { return false; }
  }

  // Run D2L's Save (the same server call its Save button makes) and report whether D2L said it worked.
  function submitD2L(ew, f) {
    return new Promise(function (resolve) {
      var settled = false;
      var finish = function (v) { if (!settled) { settled = true; clearTimeout(t); resolve(v); } };
      var t = setTimeout(function () { finish(false); }, SETTINGS.saveTimeoutMs);
      try { ew.onbeforeunload = null; } catch (e) {}
      if (ew.D2L && ew.D2L.Rpc && typeof ew.D2L.Rpc.CreatePost === 'function') {
        try {
          ew.D2L.Rpc.CreatePost('RaiseUpdateEvent', function (resp) {
            var okType = ew.D2L.Rpc.ResponseType ? ew.D2L.Rpc.ResponseType.Success : 0;
            var type = resp && typeof resp.GetResponseType === 'function' ? resp.GetResponseType() : (resp && resp.GetType ? resp.GetType() : -1);
            finish(type === okType);
          }).Call();
          return;
        } catch (e) { /* fall through to the page's own function */ }
      }
      // Fallback: the page's own Save, which reloads the page when it succeeds
      var onLoad = function () { f.removeEventListener('load', onLoad); finish(true); };
      f.addEventListener('load', onLoad);
      try { ew.callForUpdate(); } catch (e) { finish(false); }
    });
  }

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  // Reload the register page without the browser's "Resend" warning.
  // D2L pages are often reached by a form POST; location.reload() would re-POST.
  function refreshPage(state) {
    var w = state.w;
    try {
      if (w.Nav && typeof w.Nav.Go === 'function' && w.D2L && w.D2L.NavInfo) { w.Nav.Go(new w.D2L.NavInfo()); return; }
    } catch (e) {}
    w.location.href = SETTINGS.attendanceRoot + 'attendance/data_list.d2l?registerId=' + encodeURIComponent(state.registerId) + '&ou=' + encodeURIComponent(OU);
  }

  /* ------------------------------------------------------------------ *
   *  Set Attendance Data page (D2L's own page) — adds "Take Attendance by Grades"
   * ------------------------------------------------------------------ */
  function ensureStyle(d) {
    if (d.getElementById('atg-style')) return;
    var st = d.createElement('style'); st.id = 'atg-style'; st.textContent = CSS;
    (d.head || d.documentElement).appendChild(st);
  }

  function enhanceDataEdit(w, d) {
    if (d.documentElement.getAttribute('data-atg')) return;
    d.documentElement.setAttribute('data-atg', '1');
    ensureStyle(d);
    var list = d.querySelector('.d2l-action-buttons-list');
    if (!list || !d.querySelector('select[name^="SL_Status_"]')) return;
    if (!F.attendanceByGrades) { if (F.showMostLearnersPerPage) { var ne = maxSizeNeeded(d); if (ne) applyMaxSize(w, d, ne, 'atg.size.edit.' + qpi(w.location.href, 'SessionId')); } return; }
    var needEdit = F.showMostLearnersPerPage ? maxSizeNeeded(d) : null;
    if (needEdit) applyMaxSize(w, d, needEdit, 'atg.size.edit.' + qpi(w.location.href, 'SessionId'));

    var btn = d.createElement('button');
    btn.type = 'button'; btn.className = 'd2l-button'; btn.textContent = LBL.byGrades;
    var li = d.createElement('li'); li.className = 'd2l-action-buttons-item'; li.appendChild(btn);
    var emailLi = null;
    Array.prototype.forEach.call(list.children, function (x) { if (/email all users/i.test(txt(x))) emailLi = x; });
    if (emailLi && emailLi.nextSibling) list.insertBefore(li, emailLi.nextSibling); else list.appendChild(li);

    btn.addEventListener('click', function () {
      var sels = Array.prototype.slice.call(d.querySelectorAll('select[name^="SL_Status_"]'));
      var learners = sels.map(function (sel) {
        var row = sel.closest('tr');
        var link = row && row.querySelector('th[scope="row"] a, th.d_ich a');
        var nm = link ? txt(link) : (sel.getAttribute('title') || '').replace(/^Status for\s+/i, '');
        return { uid: sel.name.replace('SL_Status_', ''), name: nm };
      });
      var statuses = Array.prototype.filter.call(sels[0].options, function (o) { return o.value !== '0'; })
        .map(function (o) { return { id: o.value, sym: txt(o) }; });
      var sessionId = qpi(w.location.href, 'SessionId');
      openGradesDialog({
        opener: btn, w: w, d: d, sessionId: sessionId,
        sessionName: txt(d.querySelector('#d_content_r_p .ds_f, .ds_f')) || 'this session',
        learners: learners, statuses: statuses,
        current: function (uid) { var s = d.querySelector('select[name="SL_Status_' + uid + '"]'); return s ? s.value : '0'; },
        actions: [
          { label: 'Apply to page', primary: false, save: false },
          { label: 'Apply and Save', primary: true, save: true }
        ],
        apply: function (map, save) {
          var n = 0;
          Object.keys(map).forEach(function (uid) {
            var s = d.querySelector('select[name="SL_Status_' + uid + '"]');
            if (s && s.value !== map[uid]) { setD2LSelect(w, s, map[uid]); n++; }
          });
          if (save) {
            var saveBtn = null;
            Array.prototype.forEach.call(d.querySelectorAll('d2l-floating-buttons button, .d2l-floating-buttons button'), function (b) { if (!saveBtn && /^save$/i.test(txt(b))) saveBtn = b; });
            if (saveBtn) { setTimeout(function () { saveBtn.click(); }, 150); return; }
          }
          toastDoc(d, n ? (n + ' status' + (n === 1 ? '' : 'es') + ' set from grades. Click Save to keep them.') : 'Everyone already had those statuses.');
        }
      });
    });
  }

  /* ---------- Take Attendance by Grades (shared by both pages) ----------
   * Based on code from "D2L Attendance From Participation" by Henry Ecker.
   * Updated and revamped code to work inside any D2L instance without extra pages and plugins by Jonathan Sorrenti.
   * For each learner, look at the chosen grade items:
   *   scored above 0 on every item -> "All"     (default P)
   *   scored above 0 on some items -> "Some"    (default T)
   *   scored 0 on every item       -> "None"    (default A)
   *   any item not graded yet      -> "Ungraded"(default – / no status)
   * Exempt counts as scored above 0. Uses the session's own attendance scheme.
   * ------------------------------------------------------------------ */
  var LS_RULES = 'atg.gradeRules';
  var leVersionP = null;
  function leVersion() {
    if (!leVersionP) {
      leVersionP = fetch('/d2l/api/versions/', { credentials: 'same-origin' })
        .then(function (r) { return r.ok ? r.json() : []; })
        .then(function (list) {
          var le = (list || []).filter(function (p) { return (p.ProductCode || '').toLowerCase() === 'le'; })[0];
          return (le && le.LatestVersion) || '1.72';
        })
        .catch(function () { return '1.72'; });
    }
    return leVersionP;
  }
  function apiGet(path) {
    return fetch(path, { credentials: 'same-origin', headers: { Accept: 'application/json' } }).then(function (r) {
      if (!r.ok) throw new Error('D2L returned ' + r.status + ' for ' + path.replace(/\?.*$/, ''));
      return r.json();
    });
  }
  function apiGetAllPages(path) {
    var out = [];
    function page(url) {
      return apiGet(url).then(function (res) {
        (res.Objects || []).forEach(function (o) { out.push(o); });
        if (res.Next) {
          var next; try { var u = new URL(res.Next, location.href); next = u.pathname + u.search; } catch (e) { next = res.Next; }
          return page(next);
        }
        return out;
      });
    }
    return page(path);
  }

  function loadGradeGroups() {
    return leVersion().then(function (v) {
      var base = '/d2l/api/le/' + v + '/' + OU + '/grades/';
      return Promise.all([apiGet(base + 'categories/'), apiGet(base)]).then(function (r) {
        var groups = (r[0] || []).map(function (c) {
          return { name: c.Name, items: (c.Grades || []).map(function (g) { return { id: String(g.Id), name: g.Name }; }) };
        }).filter(function (g) { return g.items.length; });
        var none = (r[1] || []).filter(function (g) { return g.CategoryId === 0 && g.GradeType !== 'Calculated'; })
          .map(function (g) { return { id: String(g.Id), name: g.Name }; });
        if (none.length) groups.push({ name: 'No Category', items: none });
        return { v: v, groups: groups };
      });
    });
  }

  function readItemResults(v, item) {
    var base = '/d2l/api/le/' + v + '/' + OU + '/grades/' + encodeURIComponent(item.id);
    return Promise.all([apiGetAllPages(base + '/values/?pageSize=200'), apiGet(base + '/exemptions/').catch(function () { return []; })])
      .then(function (r) {
        var ex = {}; (r[1] || []).forEach(function (u) { ex[String(u.Identifier)] = true; });
        var map = {};
        r[0].forEach(function (o) {
          var uid = String(o.User && o.User.Identifier);
          var gv = o.GradeValue;
          if (ex[uid]) map[uid] = { st: 'yes', text: 'Exempt' };
          else if (gv && gv.PointsDenominator) {
            var num = gv.PointsNumerator || 0;
            map[uid] = { st: num > 0 ? 'yes' : 'no', text: (num / gv.PointsDenominator * 100).toFixed(2) + ' %' };
          } else map[uid] = { st: 'un', text: 'Not graded' };
        });
        return map;
      });
  }

  function openGradesDialog(ctx) {
    var d = ctx.d;
    ensureStyle(d);
    var ov = d.createElement('div'); ov.className = 'atg-overlay';
    var box = d.createElement('div'); box.className = 'atg-modal atg-gd';
    box.setAttribute('role', 'dialog'); box.setAttribute('aria-modal', 'true'); box.setAttribute('aria-labelledby', 'atg-gd-title');
    box.innerHTML = '<div class="atg-gd-head"><h2 id="atg-gd-title">' + escapeHtml(LBL.byGrades) + '</h2>' +
      '<div class="atg-gd-sub">' + escapeHtml(ctx.sessionName) + ' · ' + ctx.learners.length + ' learner' + (ctx.learners.length === 1 ? '' : 's') + '</div></div>' +
      '<div class="atg-gd-body" tabindex="-1">Loading grade items…</div><div class="atg-gd-foot"></div>';
    ov.appendChild(box); d.body.appendChild(ov);
    var body = box.querySelector('.atg-gd-body'), foot = box.querySelector('.atg-gd-foot');
    var release = holdFocus(d, box, ctx.opener);
    var close = function () { d.removeEventListener('keydown', onEsc, true); ov.remove(); release(); };
    var onEsc = function (e) { if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(); } };
    d.addEventListener('keydown', onEsc, true);
    body.setAttribute('aria-live', 'polite'); body.setAttribute('aria-busy', 'true');
    box.setAttribute('aria-describedby', 'atg-gd-sub');
    box.querySelector('.atg-gd-sub').id = 'atg-gd-sub';
    body.focus();
    var settle = function (focusEl, say) {             // after each step: stop "busy", move focus, announce
      body.setAttribute('aria-busy', 'false'); body.removeAttribute('aria-live');
      if (say) announce(d, say);
      if (focusEl) setTimeout(function () { try { focusEl.focus(); } catch (e) {} }, 30);
    };
    var button = function (label, primary, fn) {
      var b = d.createElement('button'); b.type = 'button'; b.className = 'd2l-button'; if (primary) b.setAttribute('primary', '');
      b.textContent = label; b.addEventListener('click', fn); foot.appendChild(b); return b;
    };

    // rules (saved by symbol so they carry across registers/schemes)
    var saved = {}; try { saved = JSON.parse(lsGet(LS_RULES) || '{}') || {}; } catch (e) {}
    var bySym = function (sym) { var m = ctx.statuses.filter(function (s) { return s.sym.toLowerCase() === String(sym || '').toLowerCase(); })[0]; return m ? m.id : '0'; };
    var GD = SETTINGS.gradeRuleDefaults || {};
    var pick = function (k, def) { return saved.hasOwnProperty(k) ? saved[k] : def; };
    var rules = {
      all: bySym(pick('all', GD.all)), some: bySym(pick('some', GD.some)),
      none: bySym(pick('none', GD.none)), un: bySym(pick('un', GD.ungraded))
    };
    var symOf = function (id) { if (id === '0') return '–'; var m = ctx.statuses.filter(function (s) { return s.id === id; })[0]; return m ? m.sym : '?'; };
    var opts = function (sel) {
      return '<option value="0"' + (sel === '0' ? ' selected' : '') + '>– (leave as is)</option>' +
        ctx.statuses.map(function (s) { return '<option value="' + s.id + '"' + (s.id === sel ? ' selected' : '') + '>' + escapeHtml(s.sym) + '</option>'; }).join('');
    };
    var pickKey = 'atg.gradePicks.' + OU + '.' + (ctx.sessionId || '');
    var data = null;

    loadGradeGroups().then(function (res) { data = res; renderPicker(); }, function (err) {
      body.innerHTML = '<p class="atg-gd-err" role="alert">Couldn\'t load the grade items: ' + escapeHtml(err.message) + '</p>';
      foot.innerHTML = ''; settle(button('Close', true, close));
    });

    function renderPicker() {
      foot.innerHTML = '';
      if (!data.groups.length) {
        body.innerHTML = '<p>This course has no grade items yet.</p>'; settle(button('Close', true, close), 'This course has no grade items yet.'); return;
      }
      var picks = {}; try { (JSON.parse(lsGet(pickKey) || '[]') || []).forEach(function (id) { picks[id] = true; }); } catch (e) {}
      var html = '<div class="atg-gd-rules">' +
        '<label>Scored above 0 on every item <select data-rule="all">' + opts(rules.all) + '</select></label>' +
        '<label>Scored above 0 on some items <select data-rule="some">' + opts(rules.some) + '</select></label>' +
        '<label>Scored 0 on every item <select data-rule="none">' + opts(rules.none) + '</select></label>' +
        '<label>Any item not graded yet <select data-rule="un">' + opts(rules.un) + '</select></label></div>' +
        '<input type="search" class="atg-gd-filter" placeholder="Filter grade items…" aria-label="Filter grade items">';
      data.groups.forEach(function (g, gi) {
        html += '<div class="atg-gd-cat" data-g="' + gi + '"><h3>' + escapeHtml(g.name) +
          ' <button type="button" class="atg-link" data-all="' + gi + '" aria-label="Select all in ' + escapeHtml(g.name) + '">Select all</button></h3>';
        g.items.forEach(function (it) {
          html += '<label class="atg-gd-item"><input type="checkbox" value="' + escapeHtml(it.id) + '"' + (picks[it.id] ? ' checked' : '') + '> <span>' + escapeHtml(it.name) + '</span></label>';
        });
        html += '</div>';
      });
      body.innerHTML = html;
      Array.prototype.forEach.call(body.querySelectorAll('select[data-rule]'), function (s) {
        s.addEventListener('change', function () { rules[s.getAttribute('data-rule')] = s.value; });
      });
      body.querySelector('.atg-gd-filter').addEventListener('input', function (e) {
        var q = e.target.value.trim().toLowerCase();
        Array.prototype.forEach.call(body.querySelectorAll('.atg-gd-cat'), function (cat) {
          var any = false;
          Array.prototype.forEach.call(cat.querySelectorAll('.atg-gd-item'), function (l) {
            var show = !q || txt(l).toLowerCase().indexOf(q) !== -1; l.style.display = show ? '' : 'none'; if (show) any = true;
          });
          cat.style.display = any ? '' : 'none';
        });
      });
      Array.prototype.forEach.call(body.querySelectorAll('[data-all]'), function (b) {
        b.addEventListener('click', function () {
          var boxes = b.closest('.atg-gd-cat').querySelectorAll('.atg-gd-item input');
          var every = Array.prototype.every.call(boxes, function (c) { return c.checked; });
          Array.prototype.forEach.call(boxes, function (c) { c.checked = !every; });
          sync();
        });
      });
      button('Cancel', false, close);
      var go = button('Compute Attendance', true, function () {
        var chosen = [];
        data.groups.forEach(function (g) { g.items.forEach(function (it) {
          var c = body.querySelector('.atg-gd-item input[value="' + it.id.replace(/"/g, '') + '"]'); if (c && c.checked) chosen.push(it);
        }); });
        lsSet(pickKey, JSON.stringify(chosen.map(function (x) { return x.id; })));
        var keep = {}; ['all', 'some', 'none', 'un'].forEach(function (k) { keep[k] = rules[k] === '0' ? '' : symOf(rules[k]); });
        lsSet(LS_RULES, JSON.stringify(keep));
        compute(chosen);
      });
      var sync = function () { go.disabled = !body.querySelector('.atg-gd-item input:checked'); };
      body.addEventListener('change', sync); sync();
      settle(body.querySelector('.atg-gd-filter'), 'Choose the grade items for this session, then Compute Attendance.');
    }

    function compute(items) {
      foot.innerHTML = '';
      body.setAttribute('aria-busy', 'true'); body.setAttribute('aria-live', 'polite');
      body.innerHTML = '<p role="status">Reading grades for ' + items.length + ' item' + (items.length === 1 ? '' : 's') + '…</p>';
      body.focus();
      Promise.all(items.map(function (it) { return readItemResults(data.v, it); })).then(function (maps) {
        renderResults(items, maps);
      }, function (err) {
        body.innerHTML = '<p class="atg-gd-err" role="alert">Couldn\'t read the grades: ' + escapeHtml(err.message) + '</p>';
        button('Back', false, renderPicker); settle(button('Close', true, close));
      });
    }

    function renderResults(items, maps) {
      foot.innerHTML = '';
      var rows = ctx.learners.map(function (L) {
        var cells = maps.map(function (m) { return m[L.uid] || { st: 'un', text: '—' }; });
        var yes = cells.filter(function (c) { return c.st === 'yes'; }).length;
        var out = cells.some(function (c) { return c.st === 'un'; }) ? rules.un
          : yes === cells.length ? rules.all : yes > 0 ? rules.some : rules.none;
        return { L: L, cells: cells, out: out };
      });
      var html = '<p class="atg-gd-sum" aria-live="polite"></p><table class="atg-gd-res"><caption class="atg-sr">Suggested attendance from grades for ' + escapeHtml(ctx.sessionName) + '</caption><thead><tr>' +
        '<th scope="col"><label class="atg-gd-name"><input type="checkbox" class="atg-gd-all" aria-label="Select all learners"> Learner</label></th>' +
        items.map(function (it) { return '<th scope="col">' + escapeHtml(it.name) + '</th>'; }).join('') +
        '<th scope="col" class="atg-gd-att">Attendance<br><span class="atg-gd-sethost"></span></th></tr></thead><tbody>';
      rows.forEach(function (r, i) {
        html += '<tr><th scope="row"><label class="atg-gd-name"><input type="checkbox" class="atg-gd-pick" data-i="' + i + '" aria-label="Select ' + escapeHtml(r.L.name) + '"> ' + escapeHtml(r.L.name) + '</label></th>' +
          r.cells.map(function (c) { return '<td class="atg-g-' + c.st + '">' + escapeHtml(c.text) + '</td>'; }).join('') +
          '<td><select data-i="' + i + '" aria-label="Attendance for ' + escapeHtml(r.L.name) + '">' + opts(r.out) + '</select></td></tr>';
      });
      body.innerHTML = html + '</tbody></table>';

      var picks = function () { return Array.prototype.slice.call(body.querySelectorAll('.atg-gd-pick')); };
      var all = body.querySelector('.atg-gd-all');
      var refresh = function () {
        var counts = {};
        Array.prototype.forEach.call(body.querySelectorAll('select[data-i]'), function (s) { counts[s.value] = (counts[s.value] || 0) + 1; });
        var n = picks().filter(function (c) { return c.checked; }).length;
        body.querySelector('.atg-gd-sum').innerHTML = 'Attendance to apply: ' +
          Object.keys(counts).map(function (k) { return '<b>' + escapeHtml(symOf(k)) + '</b> ' + counts[k]; }).join(' · ') +
          '. Change any row, or tick learners and use <b>Set selected to…</b>. Rows set to – keep their current mark.' +
          (n ? ' <b>' + n + ' selected.</b>' : '');
        all.checked = n > 0 && n === picks().length;
        all.indeterminate = n > 0 && n < picks().length;
      };
      var lastPick = null;
      picks().forEach(function (c, idx) {
        c.addEventListener('click', function (e) {
          if (e.shiftKey && lastPick !== null) {             // shift-click selects a range
            var a = Math.min(lastPick, idx), b = Math.max(lastPick, idx);
            picks().slice(a, b + 1).forEach(function (x) { x.checked = c.checked; });
          }
          lastPick = idx; refresh();
        });
      });
      all.addEventListener('change', function () { picks().forEach(function (c) { c.checked = all.checked; }); refresh(); });
      var setBtn = menuButton(d, 'Set selected to', 'Set selected learners to',
        [{ label: '', items: ctx.statuses.map(function (st) { return { value: st.id, text: st.sym }; }).concat([{ value: '0', text: '– (leave as is)' }]) }],
        function (v) {
        var chosen = picks().filter(function (c) { return c.checked; });
        if (!chosen.length) { toastDoc(d, 'Select at least one learner first.'); return; }
        chosen.forEach(function (c) { var s = body.querySelector('select[data-i="' + c.getAttribute('data-i') + '"]'); if (s) s.value = v; });
        toastDoc(d, chosen.length + ' learner' + (chosen.length === 1 ? '' : 's') + ' set to ' + symOf(v) + '.');
        refresh();
      }, 'atg-gd-set');
      body.querySelector('.atg-gd-sethost').appendChild(setBtn);
      body.addEventListener('change', function (e) { if (e.target.matches && e.target.matches('select[data-i]')) refresh(); });
      refresh();
      settle(body.querySelector('.atg-gd-set'), 'Suggested attendance is ready for ' + rows.length + ' learners. Review it, then apply.');

      button('Back', false, renderPicker);
      button('Cancel', false, close);
      ctx.actions.forEach(function (a) {
        button(a.label, a.primary, function () {
          var map = {};
          Array.prototype.forEach.call(body.querySelectorAll('select[data-i]'), function (s) {
            var r = rows[+s.getAttribute('data-i')];
            if (r && s.value !== '0') map[r.L.uid] = s.value;   // "–" leaves the learner's current mark alone
          });
          close();
          ctx.apply(map, a.save);
        });
      });
    }
  }

  // The grade-item symbol used on each session in Spreadsheet View
  var GRADE_ICON = '<svg viewBox="0 0 18 18" aria-hidden="true" focusable="false"><rect x="2.5" y="1.5" width="13" height="15" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5.5 5.5h7M5.5 8.5h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M8.2 13.2l1.6 1.5 3.2-3.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function addGradeButtons(state) {
    var d = state.d, m = state.model;
    m.sessions.forEach(function (s, c) {
      var b = d.createElement('button');

  /* ---------- Existing bookmarklets keep working ----------
   * A bookmarklet clicked on this page runs here, not on the D2L page shown inside.
   * When one adds a <script src> (e.g. the attendance-from-participation opener),
   * run the same script inside the D2L page too, and hide its "wrong page" alert here.
   * ------------------------------------------------------------------ */
  function passBookmarkletsThrough() {
    var hushUntil = 0, origAlert = window.alert;
    window.alert = function (msg) {
      if (Date.now() < hushUntil) { console.info('[Attendance Plus] bookmarklet ran inside the D2L page instead; hid this message here:', msg); return; }
      return origAlert.apply(window, arguments);
    };
    var mo = new MutationObserver(function (muts) {
      muts.forEach(function (mu) {
        Array.prototype.forEach.call(mu.addedNodes, function (n) {
          if (!n || n.tagName !== 'SCRIPT' || !n.src || n.hasAttribute('data-atg')) return;
          var fw, fd;
          try { fw = frame.contentWindow; fd = fw.document; void fw.location.href; } catch (e) { return; }
          if (!fd || !fd.body) return;
          hushUntil = Date.now() + 10000;
          // window.open from inside a frame can be blocked as a popup; open from here (where the click was) on its behalf
          var origOpen = fw.open;
          fw.open = function (u, name, feats) {
            var p = window.open(u, name, feats);
            if (p) { try { Object.defineProperty(p, 'opener', { value: fw, configurable: true, writable: true }); } catch (e) { try { p.opener = fw; } catch (e2) {} } }
            return p;
          };
          setTimeout(function () { try { fw.open = origOpen; } catch (e) {} }, 10000);
          var copy = fd.createElement('script'); copy.src = n.src; copy.setAttribute('data-atg', 'bookmarklet');
          fd.body.appendChild(copy);
        });
      });
    });
    mo.observe(document.documentElement, { childList: true, subtree: true });
  }

  function toastDoc(d, text) {
